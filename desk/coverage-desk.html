<title>Coverage Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a pitchbook sheet. Slim masthead, Excel-style sheet tabs, one working surface per tab,
   and a contact file that slides in from the right. Blue text marks values you typed, like hardcodes in a model. */
:root{
  --paper:#F3F5F8; --sheet:#FFFFFF; --sheet-2:#F8F9FB; --ink:#0F1B2D; --ink-2:#465264; --ink-3:#717D91;
  --rule:#D9DFE7; --rule-2:#E9EDF2;
  --accent:#BF5700; --accent-2:#9E4800; --accent-soft:#FBEBDD; --on-accent:#FFFFFF;
  --hard:#1C4ED8; --hard-soft:#E7EEFE;
  --ok:#17784A; --ok-soft:#E0F2E8; --warn:#9A6200; --warn-soft:#FBF0D6; --crit:#BD3328; --crit-soft:#FBE4E1;
  --scrim:rgba(15,27,45,.38);
  --shadow:0 1px 2px rgba(15,27,45,.06),0 12px 32px rgba(15,27,45,.12);
  --f-ui:"Archivo",Arial,Helvetica,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C121C; --sheet:#131B27; --sheet-2:#18212F; --ink:#E6EBF2; --ink-2:#A9B4C4; --ink-3:#818DA0;
  --rule:#273345; --rule-2:#1E2836;
  --accent:#F08A3C; --accent-2:#FFA160; --accent-soft:#3A2414; --on-accent:#1A0E04;
  --hard:#8EAEFF; --hard-soft:#1B2645;
  --ok:#4CC48A; --ok-soft:#12301F; --warn:#E5AE4E; --warn-soft:#33270F; --crit:#F2766B; --crit-soft:#3A1915;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C121C; --sheet:#131B27; --sheet-2:#18212F; --ink:#E6EBF2; --ink-2:#A9B4C4; --ink-3:#818DA0;
  --rule:#273345; --rule-2:#1E2836;
  --accent:#F08A3C; --accent-2:#FFA160; --accent-soft:#3A2414; --on-accent:#1A0E04;
  --hard:#8EAEFF; --hard-soft:#1B2645;
  --ok:#4CC48A; --ok-soft:#12301F; --warn:#E5AE4E; --warn-soft:#33270F; --crit:#F2766B; --crit-soft:#3A1915;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--hard)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
h1,h2,h3{font-variation-settings:"wdth" 80;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:22px;font-weight:760}
h3{font-size:15px;font-weight:720}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--hard);outline-offset:2px}

/* masthead + sheet tabs */
.mast{background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.mast-in{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:4px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.02em;flex:none}
.brand .name{font-weight:780;font-size:17px;font-variation-settings:"wdth" 78;letter-spacing:.01em;line-height:1.1}
.brand .sub{font-size:11px;color:var(--ink-3)}
.mast-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.conns{display:flex;gap:10px;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.conn{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
.tabs-scroll{overflow-x:auto;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;align-items:flex-end;min-width:max-content}
.tab{appearance:none;border:1px solid transparent;border-bottom:none;background:none;color:var(--ink-2);font:inherit;font-weight:620;padding:9px 14px 10px;border-radius:6px 6px 0 0;cursor:pointer;display:flex;gap:6px;align-items:center;margin-bottom:-1px}
.tab:hover{color:var(--ink);background:var(--sheet-2)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--rule);box-shadow:inset 0 2px 0 var(--accent)}
.tab .ct{font-family:var(--f-mono);font-size:11px;background:var(--accent-soft);color:var(--accent-2);border-radius:9px;padding:0 6px;min-width:18px;text-align:center}

main{padding-block:20px 80px}
.banner{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.crit{background:var(--crit-soft);border-color:transparent}

/* controls */
.btn{appearance:none;font:inherit;font-weight:620;font-size:13px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:7px 12px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{appearance:none;border:none;background:none;color:var(--ink-2);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:var(--r)}
.icon-btn:hover{background:var(--sheet-2);color:var(--ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.in{font:inherit;font-size:13px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.in:focus{border-color:var(--hard);outline:none;box-shadow:0 0 0 3px var(--hard-soft)}
.in.hard,textarea.in,input.in[type="text"],input.in[type="email"],input.in[type="url"],input.in[type="number"],input.in[type="date"],input.in[type="datetime-local"],input.in:not([type]){color:var(--hard)}
select.in{color:var(--ink);width:auto}
textarea.in{resize:vertical;line-height:1.5}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);min-width:0}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font:inherit;font-size:12px;font-weight:600;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);border-radius:14px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:4px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--sheet-2);border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
.tag.tie{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.tag.t-BB{color:var(--ink-2)}.tag.t-EB{color:var(--accent-2)}.tag.t-MM{color:var(--ink-2)}.tag.t-TX{color:var(--warn)}.tag.t-PC{color:var(--ok)}
.rs-row{display:grid;grid-template-columns:4px minmax(0,1fr) minmax(0,1fr);gap:12px;padding:10px 12px 10px 0;border-top:1px solid var(--rule-2);align-items:start}
.rs-row .stripe{align-self:stretch;border-radius:0 2px 2px 0;background:var(--c,var(--rule))}
.rs-row .orig{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.rs-row .sugg{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--hard)}
.rs-row.done .orig{color:var(--ink-3);text-decoration:line-through}
.rs-row.kept .sugg{color:var(--ink-3);text-decoration:line-through}
@media (max-width:620px){.rs-row{grid-template-columns:4px minmax(0,1fr)}.rs-row .sugg-col{grid-column:2}}
.final{white-space:pre-wrap;font-size:12.5px;line-height:1.5;background:var(--sheet-2);border:1px solid var(--rule-2);border-radius:var(--r);padding:12px;max-height:620px;overflow:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:620;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--ink-3))}
.g-reach{--c:var(--ink-3)}.g-wait{--c:var(--warn)}.g-engaged{--c:var(--accent)}.g-done{--c:var(--ok)}.g-closed{--c:var(--rule)}
.src{font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.src.v{color:var(--ok)}.src.g{color:var(--warn)}.src.x{color:var(--ink-3)}

/* surfaces */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.card-b{padding:0 16px 16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:12px;color:var(--ink-3);margin:6px 0 0}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty h3{margin-bottom:6px;color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--rule);background:var(--sheet-2);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sheet-2)}
.tbl .nm{font-weight:660}
.tbl .sub{font-size:12px;color:var(--ink-2)}
.tbl .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl td.cb,.tbl th.cb{width:30px}

/* today */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule-2)}
.kpi{background:var(--sheet);padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.kpi .l{font-size:12px;color:var(--ink-2);margin-top:2px}
.meter{height:4px;background:var(--rule-2);border-radius:2px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.funnel{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--rule-2);margin:4px 0 10px}
.funnel i{display:block;height:100%;background:var(--c)}
.legend{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12px}
.todo{display:flex;flex-direction:column}
.todo-row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px 10px 0;border-top:1px solid var(--rule-2)}
.todo-row:first-child{border-top:none}
.todo-row .stripe{align-self:stretch;border-radius:0 2px 2px 0;background:var(--c,var(--rule))}
.todo-row .what{min-width:0}
.todo-row .who{font-weight:660;cursor:pointer}
.todo-row .who:hover{text-decoration:underline}
.todo-row .meta{font-size:12px;color:var(--ink-2)}
.sev-crit{--c:var(--crit)}.sev-warn{--c:var(--warn)}.sev-ok{--c:var(--ok)}.sev-info{--c:var(--ink-3)}.sev-hot{--c:var(--accent)}
.group-h{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--rule)}
.group-h:first-child{border-top:none}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet-2)}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-weight:600;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);font-size:12px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--sheet);border-left:1px solid var(--rule);box-shadow:var(--shadow);z-index:41;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) 20px}
.dr-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dr-head h2{margin:2px 0}
.dr-bar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:14px 0}
.next{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--sheet-2);border-left:4px solid var(--c,var(--rule));margin-bottom:6px;flex-wrap:wrap}
.dr-sec{border-top:1px solid var(--rule);padding-top:16px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.dr-sec h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field-row{display:flex;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg-b{appearance:none;font:inherit;font-size:12px;font-weight:600;padding:5px 9px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);cursor:pointer}
.seg-b.on{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
.prep{white-space:pre-wrap;font-size:13px;background:var(--sheet-2);border-radius:var(--r);padding:12px;border:1px solid var(--rule-2)}
.log{display:flex;flex-direction:column;gap:4px;font-size:12px}
.log div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--ink-2);font-size:12px;font-weight:600}
.pretext{white-space:pre-wrap;font-size:12px;color:var(--ink-2);max-height:240px;overflow:auto;background:var(--sheet-2);padding:10px;border-radius:var(--r);margin-top:6px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--sheet);border-radius:8px;box-shadow:var(--shadow);width:min(760px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.progress-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.progress-list li{display:flex;gap:8px;align-items:center}
.progress-list li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--rule);flex:none}
.progress-list li.run::before{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.progress-list li.done::before{background:var(--ok);border-color:var(--ok)}
.progress-list li.fail::before{background:var(--crit);border-color:var(--crit)}
.progress-list li.skip{color:var(--ink-3)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.progress-list li.run::before{animation:none}}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.form-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.form-grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.form-grid,.form-grid.four{grid-template-columns:minmax(0,1fr)}}

/* toasts + bulk bar */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:var(--r);font-size:13px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.toast a{color:inherit;font-weight:700}
.toast.crit{background:var(--crit);color:#fff}
.toast.warn{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:55;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.bulkbar .meter{width:140px;margin:0}
.skel{height:14px;border-radius:3px;background:var(--rule-2);margin:10px 16px}

/* rebuild: funnel strip, step layouts, resume preview */
.flow-scroll{overflow-x:auto;scrollbar-width:none}
.flow-scroll::-webkit-scrollbar{display:none}
.flow{display:flex;align-items:center;gap:4px;padding-bottom:10px;min-width:max-content;font-size:12px;color:var(--ink-2)}
.flow .step{appearance:none;border:1px solid var(--rule-2);background:var(--sheet-2);color:var(--ink-2);font:inherit;font-size:12px;border-radius:14px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.flow .step b{color:var(--ink);font-weight:600}
.flow .step:hover{border-color:var(--ink-3)}
.flow .arrow{color:var(--ink-3)}
.tab.gear{margin-left:auto}
.lead-p{margin:4px 0 0;font-size:13px;max-width:72ch}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.addbar .in{flex:1 1 260px;width:auto}
.actionrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--rule-2)}
.actionrow:first-child{border-top:none;padding-top:0}
.actionrow>div{flex:1 1 240px}
.batch-item{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--rule-2)}
.batch-item:first-child{border-top:none;padding-top:0}
.mini{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.mini-row{appearance:none;border:none;background:none;font:inherit;font-size:13px;color:var(--ink);display:flex;justify-content:space-between;gap:12px;padding:6px 8px;border-radius:var(--r);cursor:pointer;text-align:left;align-items:baseline;width:100%}
.mini-row:hover,.mini-row.on{background:var(--sheet-2)}
.mini-row.on{box-shadow:inset 3px 0 0 var(--accent)}
/* Today: the daily checklist built from the desk */
.td-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.td-prog{flex:0 1 300px;min-width:200px}
.td-prog .meter{height:6px;margin-top:6px}
.td-note{font-size:12px;color:var(--ink-2);margin:0 0 14px;display:flex;gap:6px 14px;flex-wrap:wrap}
.td-note .warn{color:var(--warn)}
.td-sec{margin-bottom:14px}
.td-sec .card-h{padding-bottom:6px}
.td-sec .card-h h3 .faint{font-weight:500;font-size:13px}
.task{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:10px 16px;border-top:1px solid var(--rule-2)}
.task.hot{box-shadow:inset 3px 0 0 var(--crit)}
.task.warn{box-shadow:inset 3px 0 0 var(--warn)}
.task input[type=checkbox]{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.task .tt{font-weight:620;line-height:1.35;overflow-wrap:anywhere}
.task .ts{font-size:12px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.task .tn{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;font-size:12px}
.task .ta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.task .mins{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.task.done .ta .btn:not([data-act="taskDel"]){display:none}
.lnk{appearance:none;border:none;background:none;padding:0;font:inherit;color:var(--hard);cursor:pointer;text-align:left}
.lnk:hover{text-decoration:underline}
.td-add{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--rule-2)}
.td-add .in{flex:1 1 220px;width:auto}
.td-add select.in{flex:0 0 auto}
.task .tn .lnk{padding:4px 0}
#tdLater .mini-row>span:first-child{min-width:0;overflow-wrap:anywhere}
#tdLater .mini-row>span:last-child{flex:none;white-space:nowrap}
#tdLater .lnk{padding:4px 8px}
.td-cleared{margin:-4px 0 14px;font-size:12px;color:var(--ink-3)}
.td-cleared summary{cursor:pointer}
.td-cleared ul{margin:6px 0 0;padding-left:18px}
.td-cleared li{text-decoration:line-through}
@media (max-width:640px){.task{grid-template-columns:20px minmax(0,1fr)}.task .ta{grid-column:2;justify-content:flex-start}}
a.li{font-family:var(--f-mono);font-size:10px;font-weight:600;background:var(--hard);color:var(--sheet);border-radius:3px;padding:0 4px;text-decoration:none;vertical-align:1px}
.mono-ta{font-family:var(--f-mono);font-size:12px;line-height:1.55}
.grid-res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-res.inner{margin-top:16px}
@media (max-width:1000px){.grid-res{grid-template-columns:minmax(0,1fr)}}
.grid-tl{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid-tl{grid-template-columns:minmax(0,1fr)}}
.role-read{background:var(--sheet-2);border:1px solid var(--rule-2);border-radius:var(--r);padding:10px 12px}
/* The resume preview stays white in both themes, like the printout. */
.rz-wrap{background:var(--rule-2);border-radius:var(--r);padding:12px;overflow:auto;max-height:880px}
.rz{background:#FFFFFF;color:#111111;font-family:"Times New Roman",Times,serif;font-size:11.5px;line-height:1.3;padding:28px 32px;box-shadow:0 1px 3px rgba(0,0,0,.18);max-width:640px;margin:0 auto}
.rz-name{text-align:center;font-weight:700;font-size:17px}
.rz-contact{text-align:center;font-size:11px;margin-top:2px}
.rz-sec{font-weight:700;text-transform:uppercase;border-bottom:1px solid #111111;margin:10px 0 3px;font-size:11.5px;letter-spacing:.02em}
.rz-ent{margin-top:4px}
.rz-row{display:flex;justify-content:space-between;gap:12px}
.rz-row span{white-space:nowrap}
.rz ul{margin:1px 0 0;padding-left:16px}
.rz li,.rz-ln{margin:0}
@media (max-width:620px){.rz{padding:18px 16px;font-size:10.5px}.rz-row{flex-wrap:wrap;gap:0 8px}}
details.card>summary{list-style:none}

function normName(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,""); }

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===","||ch==="\t"){ row.push(f); f=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=ch; }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

function rebuildFirms(){
  const out = LIB.map(f=>{ const t=S.targets[f.id]||{}; return {...f, ...(t.over||{}), on:!!t.on, tier:t.tier||2, tx:t.tx||"", mynote:t.note||"", rx:f.m.map(p=>new RegExp(p,"i"))}; });
  for (const [id,t] of Object.entries(S.targets)) if (t.custom && t.name) {
    const nm=String(t.name); const rx=(Array.isArray(t.m)&&t.m.length?t.m:[nm.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")]).map(p=>{try{return new RegExp(p,"i");}catch{return null;}}).filter(Boolean); out.push({id,name:nm,type:t.type||"MM",domain:t.domain||"",mail:t.mail||t.domain||"",pat:t.pat||"first.last",careers:t.careers||"",tx:t.tx||"",mynote:t.note||"",conf:"verify",on:!!t.on,tier:t.tier||2,custom:true,rx});
  }
  FIRMS = out;
}
function matchFirm(name){ const n=String(name||"").trim(); if(!n) return null; return FIRMS.find(f=>f.rx.some(r=>r.test(n))) || null; }
function firmById(id){ return FIRMS.find(f=>f.id===id) || null; }
function firmOf(c){ return (c.firmId && firmById(c.firmId)) || matchFirm(c.firm); }
function trackFor(firm){ return firm?.type==="PC" ? {long:"private credit",short:"Private Credit"} : {long:"investment banking",short:"IB"}; }
function inferPattern(email,first,last){ const local=String(email||"").toLowerCase().split("@")[0]; const f=normName(first), l=normName(last); if(!f||!l) return null; return PAT_ORDER.find(p=>PATS[p](f,l)===local) || null; }
function buildIndex(){
  const byFirm={}, ok={}, bad={};
  for (const c of Object.values(S.contacts)) {
    const f=firmOf(c); if(!f) continue; (byFirm[f.id] ||= []).push(c);
    if (c.email && ["clay","import","replied","manual"].includes(c.emailSrc)) { const p=inferPattern(c.email,c.first,c.last); if(p){ ok[f.id] ||= {}; ok[f.id][p]=(ok[f.id][p]||0)+1; } }
    for (const b of (c.bounced||[])) { const p=inferPattern(b,c.first,c.last); if(p){ bad[f.id] ||= {}; bad[f.id][p]=(bad[f.id][p]||0)+1; } }
  }
  const pat={};
  for (const f of FIRMS) {
    const o=ok[f.id]||{}, b=bad[f.id]||{};
    const best=Object.entries(o).sort((x,y)=>y[1]-x[1])[0];
    if (best) pat[f.id]={pat:best[0],why:`confirmed by ${best[1]} verified email${best[1]>1?"s":""}`,lvl:"v",bad:b};
    else if ((b[f.pat]||0)>=2) { const alt=PAT_ORDER.find(p=>!b[p])||f.pat; pat[f.id]={pat:alt,why:`${f.pat} bounced ${b[f.pat]} times, now trying ${alt}`,lvl:"g",bad:b}; }
    else pat[f.id]={pat:f.pat,why:f.conf==="common"?"widely reported format":"best guess, not yet confirmed",lvl:f.conf==="common"?"v":"g",bad:b};
  }
  S.idx={byFirm,pat};
}
function guessEmail(c,avoid=[]){
  const firm=firmOf(c); const f=normName(c.first), l=normName(c.last);
  if(!firm||!firm.mail||!f||l.length<2) return "";
  const info=S.idx.pat[firm.id]||{pat:firm.pat,bad:{}};
  const order=[info.pat,...PAT_ORDER.filter(p=>p!==info.pat&&!(info.bad||{})[p])];
  const av=avoid.map(x=>String(x).toLowerCase());
  for (const p of order){ const e=PATS[p](f,l)+"@"+firm.mail; if(!av.includes(e)) return e; }
  return "";
}

/* ---------- next actions ---------- */
function nextAction(c,now=Date.now()){
  const fu=(Number(P().followUpDays)||6)*DAY;
  switch(c.stage||"lead"){
    case "lead": return c.email ? (isVerified(c)?{label:"Write the cold email",due:c.createdAt||now,sev:"info",act:"compose",kind:c.referrer?"referral":"cold"}:{label:"Verify the email, then write",due:null,sev:"info",act:"findEmail",kind:c.referrer?"referral":"cold"}) : {label:"Find an email",due:null,sev:"info",act:"findEmail",kind:c.referrer?"referral":"cold"};
    case "drafted": return {label:mailKey()==="outlook"?"Send the email you opened in Outlook":"Send your Gmail draft",due:c.draftedAt||now,sev:"warn",act:"gmailLink"};
    case "emailed": return {label:"Send follow-up 1",due:(c.lastSentAt||c.emailedAt||now)+fu,sev:"warn",act:"compose",kind:"fu1"};
    case "fu1": return {label:"Send the final follow-up",due:(c.lastSentAt||now)+fu,sev:"warn",act:"compose",kind:"fu2"};
    case "fu2": return {label:"No reply. Close it out",due:(c.lastSentAt||now)+fu,sev:"info",act:"close"};
    case "replied": return {label:"Reply and set a time",due:c.repliedAt||now,sev:"hot",act:"open"};
    case "scheduled": return c.callAt && c.callAt<now ? {label:"Log how the call went",due:c.callAt,sev:"hot",act:"open"} : {label:"Prep for the call",due:c.callAt?c.callAt-DAY:now,sev:"hot",act:"prep"};
    case "talked": return {label:"Send a thank-you",due:c.talkedAt||now,sev:"crit",act:"compose",kind:"thanks"};
    case "thanked": case "advocate": return {label:"Check in with an update",due:(c.checkinAt||c.thankedAt||c.talkedAt||now)+35*DAY,sev:"ok",act:"compose",kind:"checkin"};
    default: return null;
  }
}

function hashKey(s){ let h=5381; for(const ch of String(s)) h=((h<<5)+h+ch.charCodeAt(0))|0; return (h>>>0).toString(36); }
/* People with a prepared email go first, in the order of the sending plan; then the usual order. */
function readyList(includeGuesses){ return Object.values(S.contacts).filter(c=>(c.stage||"lead")==="lead"&&c.email&&(includeGuesses||isVerified(c))&&!S.batch.some(b=>b.id===c.id)).sort((a,b)=>(a.draft?.prepared?a.queue??1e9:1e9)-(b.draft?.prepared?b.queue??1e9:1e9)||(b.ties||[]).length-(a.ties||[]).length||(a.createdAt||0)-(b.createdAt||0)); }
function dueList(){ const now=Date.now(); return Object.values(S.contacts).filter(c=>{ if(!["emailed","fu1","fu2","replied","scheduled","talked"].includes(c.stage)) return false; const a=nextAction(c,now); return a&&a.due!=null&&a.due<=now+DAY; }); }
function counts(){
  const cs=Object.values(S.contacts); const on=FIRMS.filter(f=>f.on);

let unDay=null;
async function saveDay(patch){
  if(!S.db){ toast(NO_DB,"warn"); dataChanged(); return; }
  if(!S.ready.day){ toast("Still loading today's check marks. Try again in a moment.","warn"); dataChanged(); return; }
  const key=S.dayKey, body={...(S.day||{}),...JSON.parse(JSON.stringify(patch)),day:key,at:Date.now()}; S.day=body; dataChanged();
  /* Own writes come back through the snapshot right away, so no extra guard is needed here. */
  try{ await enqueue("d:"+key,()=>S.db.doc("days/"+key).set(body)); }catch(e){ toast(dbErr(e),"crit"); }
}
async function saveTask(id,patch){ if(!S.db){ toast(NO_DB,"warn"); dataChanged(); return; } const body={...(S.tasks[id]||{}),...JSON.parse(JSON.stringify(patch))}; delete body.id; S.tasks[id]={...body,id}; dataChanged(); return enqueue("tk:"+id,()=>S.db.collection("tasks").doc(id).set(body)).catch(e=>toast(dbErr(e),"crit")); }
async function deleteTask(id){ if(!S.db) return toast(NO_DB,"warn"); delete S.tasks[id]; dataChanged(); return enqueue("tk:"+id,()=>S.db.collection("tasks").doc(id).delete()).catch(e=>toast(dbErr(e),"crit")); }
function subDay(){ if(!S.db) return; try{ unDay?.(); }catch{} const key=S.dayKey;
  unDay=S.db.doc("days/"+key).onSnapshot(d=>{ if(key!==S.dayKey) return; if(!d.exists&&d.metadata?.fromCache) return; S.day=d.exists?d.data():null; S.ready.day=true; dataChanged(); },()=>{ toast("Couldn't load today's check marks. Reload the page.","warn"); }); }
/* A page left open overnight rolls over to the new day. */
setInterval(()=>{ const k=dayKeyOf(); if(k!==S.dayKey){ S.dayKey=k; S.day=null; if(S.db) S.ready.day=false; subDay(); dataChanged(); } },60000);

async function guessDomain(name,kind){
  if(!S.sample) return {domain:"",type:""};
  try{ const o=await askJSON(`What is the official website domain of the company "${name}"${kind?` (${kind})`:""}? Answer from what you know. Return only JSON: {"domain":"example.com or empty if unsure","type":"BB|EB|MM|TX|PC","confident":true}. Types: BB bulge bracket bank, EB elite boutique, MM middle-market bank, TX Texas or regional bank/boutique, PC private credit or direct lender.`,{modelTier:"quick"});
    const dom=String(o?.domain||"").toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/.*$/,"");
    return {domain:/^[a-z0-9.-]+\.[a-z]{2,}$/.test(dom)?dom:"",type:TYPES[o?.type]?o.type:"",confident:!!o?.confident}; }
  catch{ return {domain:"",type:""}; }
}
async function addFirmByName(name,opts={}){
  name=String(name||"").trim(); if(!name) return null;
  const hit=FIRMS.find(f=>f.name.toLowerCase()===name.toLowerCase())||matchFirm(name);
  if(hit){ if(!hit.on) await saveTarget(hit.id,{on:true}); return hit; }
  const g=opts.domain?{domain:opts.domain,type:opts.type||""}:await guessDomain(name,opts.kind);
  const id="c-"+slug(name);
  await saveTarget(id,{custom:true,name:name.slice(0,80),type:opts.type||g.type||"MM",domain:g.domain,mail:g.domain,pat:"first.last",on:true,addedFrom:opts.from||"typed",...(g.domain&&!g.confident&&!opts.domain?{note:"Website guessed by Claude. Check it with Edit."}:{}),...(opts.tx?{tx:opts.tx}:{})});

}
function discDsl(){

function nextFirmBatch(one){

const NOT_BANKER=/\b(wealth|pwm|private wealth|sales|trading|s&t|quant\w*|risk|strateg(y|ist)|equity research|research|real estate|operations|technology|engineer\w*|audit|compliance|chief financial|cfo|marketing|human resources|product|data|mortgage|loan officer|mentor|candidate|student|teaching)\b/i;

function peopleDsl(){
  const p=P(), q=s=>`"${String(s).replace(/["\\]/g,"")}"`, names=(p.schoolNames||[]).filter(Boolean);

  if(S.pfind.scope!=="alumni") return `select from people where ${titles}`;
  const edu=[names.length?`school_name in (${names.map(q).join(", ")})`:"",p.schoolKeyword?`school_name contains ${q(p.schoolKeyword)}`:""].filter(Boolean).join(" or ");

async function findPeople(oneFirm){
  const firms=nextFirmBatch(oneFirm); if(!firms.length) return toast(oneFirm?"Add this firm's website first (Edit).":"No firms with websites on your list.","warn");
  if(S.pfind.running) return; S.pfind.running=true; updateView();
  let added=0; const p=P();
  try{
    const goal=Math.max(20,Number(p.dailyLeadGoal)||50);
    let r=await call("Clay","search-contacts",{companyIdentifiers:firms.map(f=>f.domain),dslQuery:peopleDsl()}); let page=1;
    const take=async r=>{ for(const c of (r?.contacts||[])){
      const company=c.latest_experience_company||""; const dom=String(c.domain||c.companyIdentifier||"").toLowerCase();
      const f=matchFirm(company)||(company?null:firms.find(x=>x.domain===dom)); if(!f) continue;

      const id=idFor(c.url,c.name,company); if(S.contacts[id]) continue;

      const doc={name:c.name,first,last,firm:company||f.name,firmId:f.id,title:c.latest_experience_title||"",location:c.location_name||"",linkedin:c.url||"",startedRole:c.latest_experience_start_date||"",school:alum?(p.schoolNames[0]||p.school):"",ties:alum?[`${p.school} alum`]:[],stage:"lead",source:alum?"Clay alumni search":"Clay banker search",clayTask:r.taskId,clayEntity:String(c.entityId||c.profile_id||""),log:addLog({},alum?"Found by alumni search":"Found by banker search")};
      const g=guessEmail(doc); if(g){ doc.email=g; doc.emailSrc="pattern"; }
      await saveContact(id,doc).catch(()=>{}); added++;
    } };
    await take(r);
    while(r?.hasMore&&r.taskId&&page<3&&added<goal){ r=await call("Clay","load-more-search-results",{taskId:r.taskId}); page++; await take(r); }
    for(const f of firms) await saveTarget(f.id,{lastSearched:Date.now()});
    toast(`Added ${added} ${added===1?"person":"people"} from ${firms.length===1?firms[0].name:`${firms.length} firms`}.${added?" Verify their emails next.":" Try the other search scope."}`,added?"ok":"warn");
  }catch(e){ toast(errText(e,"Clay"),"crit"); }

async function writeBatch(items){
  if(!P().name) return toast("Add your name in Settings first.","warn");
  if(S.bulk) return toast("Wait for the current batch to finish.","warn");
  if(!items.length) return;
  const b=bulkStart("Writing emails",items.length); let n=0;
  for(const it of items){ if(b.stop) break;
    const c=S.contacts[it.id]; if(!c){ bulkStep(); continue; }
    try{ const d=(it.kind==="fu1"||it.kind==="fu2")?followupTemplate(c,it.kind):(c.draft?.prepared&&c.draft.kind===it.kind&&c.draft.body)?c.draft:await writeEmail(it.id,it.kind,true);
      if(d){ S.batch=S.batch.filter(x=>x.id!==it.id); S.batch.push({id:it.id,kind:it.kind,subject:d.subject,body:d.body,note:d.note||""}); n++; } }
    catch(e){ toast(sampleErr(e),"crit"); if(/not_granted|sampling|rate_limited|no_sample|not_declared/.test(e?.code||"")) break; }
    bulkStep(c.name); if(S.tab==="outreach") updateOutreach();
  }
  bulkEnd(n?`${n} email${n===1?"":"s"} ready. Review them, then ${mailKey()==="outlook"?"open each one in Outlook":"save them to Gmail"}.`:"");
  if(S.tab!=="outreach") setTab("outreach"); else updateOutreach();
}
async function saveBatch(){
  const items=[...S.batch]; if(!items.length) return;
  const b=bulkStart(`Saving to ${M().name} drafts`,items.length); let ok=0; const left=[];
  for(let i=0;i<items.length;i++){ const it=items[i];
    if(b.stop){ left.push(...items.slice(i)); break; }
    S.kind[it.id]=it.kind; S.drafts[it.id+":"+it.kind]={kind:it.kind,subject:it.subject,body:it.body,note:it.note};
    try{ if(await mailDraft(it.id,true)) ok++; else left.push(it); }
    catch(e){ toast(errText(e,M().name),"crit"); left.push(it); if(/needs_reauth|server_not|not_in_manifest|no_mcp|blocked/.test(e?.code||"")){ left.push(...items.slice(i+1)); break; } }
    bulkStep(S.contacts[it.id]?.name);
  }
  S.batch=left; bulkEnd(); toast(`${ok} saved to ${M().name} drafts.${ok?` Open ${M().name} to read and send them${mailKey()==="outlook"?", and attach your resume to first emails":""}.`:""}${left.length?` ${left.length} still here.`:""}`,ok?"ok":"warn",ok?M().drafts:undefined); updateOutreach();
}

function jobKey(j){ return `${j.title}|${j.company}|${j.location}`.replace(/\s+/g," ").trim().toLowerCase(); }
function isNewJob(j){ return j.firstSeen && Date.now()-j.firstSeen<3*DAY; }
function allJobs(){
  const out=[], seen=new Set();
  const push=(j,fid)=>{ const key=jobKey(j); if(seen.has(key)) return; seen.add(key); const f=fid&&fid!=="_open"?firmById(fid):matchFirm(j.company); out.push({...j,key,firmId:f?.id||""}); };
  for(const [id,d] of Object.entries(S.firmJobs)) for(const j of (d.items||[])) push(j,id);
  for(const j of S.jobs.results) push(j,"");
  return out;
}

  if(raw.length<30) return toast("Paste more text first.","warn");
  S.res.busy=label||"merge"; updateMaster();
  try{
    const {text}=await ask(`You maintain a college student's MASTER resume for ${P().focus} recruiting. Merge the NEW TEXT into the CURRENT MASTER and return the full updated master.

RULES
- Output plain text in exactly this format, nothing else:
${RZ_FORMAT}
- Keep every real fact, title, date, number and organization. Never invent experience, numbers, clients or deals.
- If NEW TEXT repeats something already in the master, combine them and keep the stronger wording. Keep all distinct bullets: the master may run past one page.
- Bullets start with a strong past-tense verb (present tense for a current role), no "I", no "responsible for". Where a number would help but is not given, add a placeholder like [#] or [$X].
- Section order: EDUCATION, EXPERIENCE, LEADERSHIP & ACTIVITIES, SKILLS & INTERESTS (add others only if the text needs them). Most recent entries first.
- No em dashes. Use "to" for date ranges (Jan 2025 to Present).
${cur?"":`- The header is: ${P().name||"[Your Name]"} on line 1, then contact details on line 2 if the text has them.`}

CURRENT MASTER
"""
${cur||"(empty)"}
"""

NEW TEXT
"""
${raw.slice(0,20000)}
"""`,{modelTier:"default"});
    const out=tidy(text).replace(/^```\w*\n?|\n?```$/g,"").trim();
    if(rzParse(out).sections.length<1) throw {code:"invalid_json"};
    const ta=$("#rz-master"); if(ta) ta.value=out; S.res.masterDirty=true; const rr=$("#rz-raw"); if(rr) rr.value="";
    toast("Merged. Check it, then Save.","ok");
  }catch(e){ toast(e?.code?sampleErr(e):"Couldn't merge.","crit"); }
  S.res.busy=""; updateMaster();
}

function tjSteps(list){ const ul=$("#tjSteps"); if(!ul) return; ul.hidden=!list; if(list) ul.innerHTML=list.map(s=>`<li class="${s.st||""}">${esc(s.t)}</li>`).join(""); }
function parseIndeedDetail(r){ const t=typeof r==="string"?r:(r?.result??""); const m=String(t).split(/Job Description:\s*/i); return {desc:(m[1]||"").trim(),url:(String(t).match(/\*\*View Job URL:\*\*\s*(https?:\/\/\S+)/)||[])[1]||""}; }
async function pullPosting(j){
  const tryId=async id=>{ if(!id) return ""; const r=await call("Indeed","get_job_details",{job_id:id}); return parseIndeedDetail(r).desc; };
  try{ const d=await tryId(j.jobId); if(d.length>200) return d; }catch{}
  const r=await call("Indeed","search_jobs",{search:`${j.title} ${j.company}`.slice(0,120),location:j.location||"United States",country_code:"US"});
  const hit=parseIndeed(r).find(x=>x.title===j.title&&x.company===j.company)||parseIndeed(r).find(x=>x.company===j.company);
  if(!hit?.jobId) throw {code:"tool_error",message:"Indeed no longer lists this posting. Paste it from the firm's careers page instead."};
  return tryId(hit.jobId);
}
function tailorPrompt(master,jd,company,title,firm){
  const titleOnly=!jd;

STEP 2, BUILD A ONE-PAGE RESUME FOR THAT ROLE from the MASTER.
- Lead with what this role does all day. For an IB role, put modeling, valuation, transaction, pitch and client work first. For a private credit or lending role, put credit analysis, underwriting, cash flow, leverage and covenant work first. For a sector group, bring forward anything in the master tied to that sector (an energy club, an energy internship, a related project) and say so plainly.
- Choose the entries and bullets that best fit the role; drop weaker or unrelated ones. One page means about 12 to 16 bullets in total and 2 to 4 per entry. Reorder bullets inside each entry so the most role-relevant come first.
- Reword bullets to use the role's own language where the master's facts support it (for example "valuation" for an M&A group, "credit memo" or "underwriting" for direct lending). Keep each bullet to about one printed line (100 to 115 characters), two at most.
- Order the coursework, skills and interests so the role-relevant items come first. List only items in the master.
- Use ONLY facts in the master. Never invent experience, numbers, clients, deals, skills, coursework or interests. Keep [placeholders] as they are.
- Keep EDUCATION first and keep the header exactly as in the master. No em dashes.
- Output the resume in exactly this plain-text format:
${RZ_FORMAT}

STUDENT
${meText()}

ROLE: ${title} at ${company}
${titleOnly?"(No posting text is available. Tailor to the title and to what this role normally involves at this firm. Say so in changes.)":`POSTING
"""
${String(jd).slice(0,9000)}
"""`}

MASTER
"""
${master.slice(0,20000)}
"""

Return only JSON: {"role":{"track":"","group":"","product":"","level":"","location":"","mustHaves":["up to 6"],"niceToHaves":["up to 4"]},"fit":["2 to 4 one-line checks of the student against the must-haves, e.g. 'Posting wants graduation Dec 2028 to Jun 2029; you graduate May 2029. Fits.'"],"resume":"the full tailored resume text","matched":["up to 10 role keywords the tailored resume now shows"],"missing":["up to 6 things the role asks for that the master does not show"],"changes":["3 to 6 short notes on what you chose, reordered or reworded for this role and why"],"why":"a first-person 90 to 130 word answer to 'Why ${company}, and why this group?' grounded in the role and the student's background; no invented facts, no em dashes"}`;
}
async function tailorRun(redoId){

  else if(S.res.job==="_paste"){ jd=($("#tjPaste")?.value||"").trim(); company=($("#tjFirm")?.value||"").trim(); title=($("#tjRole")?.value||"").trim()||"Posting"; if(jd.length<150||!company) return toast("Paste the posting and the firm name.","warn"); }

  let titleOnly=false;

    if(!jd&&j){ try{ jd=await pullPosting(j); }catch(e){ if(/needs_reauth|server_not|not_in_manifest|no_mcp|approval|consent|selection/.test(e?.code||"")) throw e; jd=""; } }
    if(!jd||jd.length<150){ jd=""; titleOnly=true; steps[0]={t:"No posting text on Indeed. Tailoring to the role title",st:"skip"}; } else steps[0].st="done";

    const text=tidy(String(o?.resume||"")).replace(/^```\w*\n?|\n?```$/g,"").trim(); if(rzParse(text).sections.length<1) throw {code:"invalid_json"};

    const id=redoId||("r-"+hashKey(jobKey||company+title)+"-"+Date.now().toString(36));
    const ro=o?.role||{}; const role={track:String(ro.track||""),group:String(ro.group||""),product:String(ro.product||""),level:String(ro.level||""),location:String(ro.location||j?.location||""),mustHaves:arr(ro.mustHaves,6).map(String),niceToHaves:arr(ro.niceToHaves,4).map(String)};
    const doc={company,title,url,jobKey,firmId:firm?.id||"",jd:jd.slice(0,12000),titleOnly,role,fit:arr(o?.fit,4).map(String),text,matched:arr(o?.matched,10).map(String),missing:arr(o?.missing,6).map(String),changes:arr(o?.changes,6).map(String),why:tidy(String(o?.why||"")).slice(0,1500),createdAt:Date.now(),useForEmails:false};
    await saveResume(id,doc); S.res.sel=id; S.res.tjDirty=false; steps[2].st="done"; tjSteps(steps);
    if(jobKey&&!S.apps["j-"+hashKey(jobKey)]) await saveApp("j-"+hashKey(jobKey),{firm:company,firmId:firm?.id||"",program:title,location:j?.location||"",url,status:"Open",jobKey});

  S.res.busy=""; updateTailor(true);

const RS_RULES = `- One page. For students, Education comes first: school, degree, expected graduation month and year, GPA if 3.5 or higher, honors, relevant coursework.
- Each experience bullet starts with a strong action verb, past tense for past roles and present tense for a current role. No "I", "responsible for", "helped", "assisted with", "worked on", "various", "duties included".
- Show results with numbers: dollar amounts, percentages, counts, time saved, assets covered. NEVER invent a number, client, deal or fact. If a number would make the line stronger but is not given, put a bracketed placeholder such as [$X] or [#] and say in "why" what real number to fill in.
- Name real finance work only where the line supports it: DCF, LBO, comparable companies, precedent transactions, three-statement model, credit memo, covenant or leverage analysis, pitch materials, due diligence.
- Aim for one printed line, about 100 to 115 characters. Two lines at most. Cut filler and repeated words.
- Keep tense, date format and punctuation consistent across the page.
- Activities and leadership: say what you built, led or grew, and the result.
- Skills line: hard skills only (Excel, PowerPoint, Capital IQ, FactSet, Bloomberg, PitchBook, Python, SQL), languages, and two or three specific interests that start conversations.`;
function rsSource(){ return ($("#rs-text")?.value ?? masterText()).replace(/\r/g,""); }
function rsNumbered(text){ return text.split("\n").map(s=>s.replace(/\s+$/,"")).filter(s=>s.trim()).map((s,i)=>({n:i+1,text:s.trim()})); }
function rsKeepPrefix(orig,v){ const pre=(orig.match(/^(##?\s+|[-•]\s+)/)||[""])[0]; if(!pre) return v; const bare=v.replace(/^(##?\s+|[-•]\s+)/,""); return pre.trim().startsWith("#")?pre+bare:"- "+bare; }
function rsFinal(){ return S.rs.lines.map(l=>{ const v=l.decision==="accept"&&l.rewrite?l.rewrite:l.decision==="edit"&&l.edited?l.edited:null; return v?rsKeepPrefix(l.text,v):l.text; }).join("\n"); }

async function rsRun(){

${meText()}

${lines.map(l=>`${l.n}: ${l.text}`).join("\n")}`,{modelTier:"default"});

async function rsRetry(i){

${RS_RULES}

NEARBY LINES FOR CONTEXT
${ctx}

LINE TO REWRITE
${l.text}

PREVIOUS SUGGESTION (write something different)
${l.rewrite||"(none)"}

Return only JSON: {"rewrite":"","why":"one short sentence"}`,{modelTier:"quick"});
    if(o?.rewrite){ l.rewrite=tidy(String(o.rewrite)); l.why=String(o.why||l.why); l.decision="pending"; delete l.edited; rsPersist(); } }

function setBusy(id,v){ if(v) S.busy[id]=v; else delete S.busy[id]; if(S.open===id) renderDrawer(true); if(id==="_answers") updateView(); }
function enrichOf(ctx,ent,re){
  const list=ctx?.contacts||ctx?.entities||ctx?.results||[];
  const row=list.find(x=>String(x.entityId??x.profile_id??x.id)===String(ent))||(list.length===1?list[0]:null);
  if(!row) return {done:false};
  const ens=Array.isArray(row.enrichments)?row.enrichments:[];
  const hits=ens.filter(e=>re.test(String(e.name||e.type||e.dataPointName||e.title||"")));
  if(!hits.length) return {done:false,row};
  const pending=hits.some(e=>/progress|pending|queued|running|processing/i.test(String(e.state||e.status||"")));
  const errored=hits.every(e=>/error|fail/i.test(String(e.state||e.status||"")));
  return {done:!pending,errored,hits,row};
}
async function clayEnrich(id,points){
  let c=S.contacts[id]; let taskId=c.clayTask, ent=c.clayEntity;
  if(!taskId||!ent){
    const f=firmOf(c); const dom=f?.domain||c.domain; if(!dom) throw {code:"tool_error",message:"Add this firm to your list (with its website) so Clay knows where to look."};
    const r=await call("Clay","search-contacts-by-name",{contactIdentifiers:[{contactName:c.name,companyIdentifier:dom}]});
    const hit=(r?.contacts||[])[0]; if(!hit) throw {code:"tool_error",message:`Clay couldn't find ${c.name} at ${f?.name||dom}.`};
    taskId=r.taskId; ent=String(hit.entityId??hit.profile_id);
    await saveContact(id,{clayTask:taskId,clayEntity:ent,...(!c.linkedin&&hit.url?{linkedin:hit.url}:{})});
  }
  await call("Clay","add-contact-data-points",{taskId,dataPoints:points,entityIds:[ent]});
  for(let i=0;i<16;i++){ await sleep(i<4?3000:5000);
    const ctx=await call("Clay","get-task-context",{taskId,entityIds:[ent]});
    const want=points.map(p=>p.type==="Email"?/email/i:/work|history/i);

}

/* Same rules for both accounts. sent/replies are keyed by contact id; fix maps id -> the address actually used. */
async function applyMailSync(watch,{sent,replies,bounced,fix,via},label){
  let nS=0,nR=0,nB=0; const rank={lead:0,drafted:0,emailed:1,fu1:2,fu2:3};
  for(const c of watch){
    const patch={}; const lg=t=>{ patch.log=addLog({log:patch.log||c.log},t); };
    const rp=(replies[c.id]||[]).filter(Boolean).sort((a,b)=>a-b);
    const used=fix[c.id]; if(used&&used!==c.email.toLowerCase()&&!bounced.has(c.id)){ patch.email=used; lg(`Using ${used}, the address you emailed`); }
    const e=(patch.email||c.email).toLowerCase();
    if(bounced.has(c.id)&&!rp.length){
      const bl=[...new Set([...(c.bounced||[]),e])]; const next=(c.altEmails||[]).find(a=>!bl.includes(a))||guessEmail(c,bl);
      Object.assign(patch,{bounced:bl,email:next||"",emailSrc:next?"pattern":"",stage:"lead"}); lg(`Bounced: ${e}${next?`. Trying ${next}`:""}`); nB++;
    } else {
      /* A resend within 10 minutes (say, to add a forgotten attachment) is the same email. */
      const s=[]; for(const x of (sent[c.id]||[]).filter(x=>x.at).sort((a,b)=>a.at-b.at)){ if(s.length&&x.at-s[s.length-1].at<RESEND_MS) s[s.length-1]=x; else s.push(x); }
      if(s.length){ const f0=s[0], l=s[s.length-1];
        if(!c.emailedAt||f0.at<c.emailedAt) patch.emailedAt=f0.at;
        if(!c.lastSentAt||l.at>c.lastSentAt||(!c.lastMsgId&&l.at>=c.lastSentAt)){ patch.lastSentAt=l.at; patch.lastMsgId=l.id; patch.threadId=l.threadId||""; patch.lastVia=via; }
        /* Later checks only look back a few days, so count messages newer than the last one already counted. */
        const total=(c.sentCount||0)+s.filter(x=>x.at>(c.lastSentAt||0)+RESEND_MS).length;
        if(total!==(c.sentCount||0)) patch.sentCount=total;

/* outlook_email_search answers with one JSON object per message plus a last {nextOffset|nextCursor} item. */
function msItems(r){
  const out=new Map(); let next=null, cursor=null;
  const take=j=>{
    if(Array.isArray(j)){ for(const x of j) take(x); return; }
    if(!j||typeof j!=="object") return;
    if(j.nextOffset!=null&&Number.isFinite(Number(j.nextOffset))) next=Math.max(next??0,Number(j.nextOffset));
    if(j.nextCursor) cursor=String(j.nextCursor);
    if(j.id&&("subject" in j||"sender" in j||"recipients" in j)){ out.set(String(j.id),j); return; }
    for(const v of Object.values(j)) if(v&&typeof v==="object") take(v);
  };
  if(r?.structuredContent!=null) take(r.structuredContent);
  for(const b of r?.content||[]) if(b?.type==="text"){ try{ take(JSON.parse(b.text)); }catch{} }
  if(!out.size&&r?.payload!=null) take(r.payload);
  return {items:[...out.values()],next,cursor};
}
async function msSearch(input,maxPages=40){
  const all=new Map(); let offset=0, cursor=null;
  for(let i=0;i<maxPages;i++){
    const r=await S.mcp.callTool(MS,"outlook_email_search",cursor?{...input,cursor}:{...input,offset},{cache:false});
    const {items,next,cursor:cur}=msItems(r);
    for(const m of items) all.set(String(m.id),m);
    if(cur&&cur!==cursor){ cursor=cur; continue; }
    if(!cursor&&next!=null&&next>offset&&next<=1000){ offset=next; continue; }
    break;
  }
  return [...all.values()];
}
/* An address you typed yourself (not the desk's guess) still counts when it names the person at their firm's domain. */
function matchByName(e,cs){
  const [local,dom]=String(e).split("@"); if(!dom) return null; const l=normName(local);
  const hits=cs.filter(c=>{ const cd=(c.email||"").split("@")[1], fd=firmOf(c)?.mail; if(dom!==cd&&dom!==fd) return false;
    const last=normName(c.last), first=normName(c.first); return last.length>=3&&first&&l.includes(last)&&(l.includes(first)||l.startsWith(first[0])); });
  return hits.length===1?hits[0]:null;
}
const NDR_SUBJ=/^(undeliverable|undelivered|delivery (status notification|has failed)|mail delivery (failed|subsystem)|returned mail)/i;
const AUTO_SUBJ=/^(automatic reply|auto(matic)?[- ]?reply|auto:|out of (the )?office)/i;
async function syncOutlook(manual){
  const watch=syncStart(manual,"Outlook"); if(!watch) return;
  const now=Date.now(), last=lsGet("cd.lastSync.outlook",0), iso=t=>new Date(t).toISOString();
  const byEmail=new Map(watch.map(c=>[c.email.toLowerCase(),c]));
  const sent={}, replies={}, bounced=new Set(), fix={};
  try{
    const out=await msSearch({folderName:"Sent Items",afterDateTime:iso(last?last-3*DAY:now-120*DAY),limit:25});
    for(const m of out){
      const at=Date.parse(m.sentDateTime||m.receivedDateTime)||0; if(!at) continue;
      const rc=new Set([...(m.recipients||[]),...(m.namedRecipients||[]).map(x=>x?.address)].map(emailIn).filter(Boolean));
      for(const e of rc){ let c=byEmail.get(e); if(!c){ c=matchByName(e,watch); if(c){ fix[c.id]=e; byEmail.set(e,c); } } if(!c) continue;
        (sent[c.id] ||= []).push({at,id:m.id,threadId:m.conversationId||"",subject:m.subject||""}); }
    }
    let first=Infinity; for(const c of watch) if(c.emailedAt) first=Math.min(first,c.emailedAt); for(const k in sent) for(const x of sent[k]) first=Math.min(first,x.at);
    if(first<Infinity){
      const inbox=await msSearch({folderName:"Inbox",afterDateTime:iso(Math.max(first-DAY,now-60*DAY,last?last-3*DAY:0)),limit:25});
      for(const m of inbox){
        const at=Date.parse(m.receivedDateTime||m.sentDateTime)||0, from=emailIn(m.sender), subj=String(m.subject||"");
        if(NDR_SUBJ.test(subj)||/postmaster|mailer-daemon|microsoftexchange/i.test(from)){
          for(const e of String((m.summary||"")+" "+subj).match(EMAIL_RE_G)||[]){ const c=byEmail.get(e.toLowerCase()); if(c&&(sent[c.id]?.length||c.emailedAt)) bounced.add(c.id); }
          continue;
        }
        if(AUTO_SUBJ.test(subj)) continue;
        const c=byEmail.get(from); if(c&&at) (replies[c.id] ||= []).push(at);
      }
    }
  }catch(e){ S.syncing=false; updateView(); if(manual||e?.code!=="not_in_manifest") toast(errText(e,"Outlook"),"crit"); return; }
  syncDone(manual,"Outlook",await applyMailSync(watch,{sent,replies,bounced,fix,via:"outlook"},"Outlook"));
}

async function bulkCommit(){
  const rows=S.modal?.rows||[]; if(!rows.length||!S.db) return; const addFirms=!!$("#bm-addfirms")?.checked; closeModal();
  const p=P();
  if(addFirms){ const names=[...new Set(rows.filter(r=>!r.firmId&&r.firm).map(r=>r.firm))].slice(0,30); const b=bulkStart("Adding firms to your wish list",names.length);
    for(const n of names){ if(b.stop) break; const dom=rows.find(r=>r.firm===n&&r.domain)?.domain; const f=await addFirmByName(n,{from:"import",...(dom?{domain:dom}:{})}).catch(()=>null); if(f) for(const r of rows) if(r.firm===n) r.firmId=f.id; bulkStep(n); } bulkEnd(); }
  for(const r of rows) if(r.firmId){ const f=firmById(r.firmId); if(f&&!f.on) await saveTarget(f.id,{on:true}); }
  const b=bulkStart("Adding people",rows.length); let n=0,u=0;
  for(const r of rows){ if(b.stop) break;
    const ex=S.contacts[r.id];
    try{
      if(ex){ const patch={}; const locked=["clay","replied","manual"].includes(ex.emailSrc)||(ex.emailSrc==="import"&&r.emailSrc==="pattern");
        if(r.email&&r.email!==ex.email&&!locked&&!(ex.bounced||[]).includes(r.email)){ patch.email=r.email; patch.emailSrc=r.emailSrc||"import"; }
        if((r.alts||[]).length) patch.altEmails=r.alts; if(r.linkedin&&!ex.linkedin) patch.linkedin=r.linkedin; if(r.title&&!ex.title) patch.title=r.title;
        if(Object.keys(patch).length){ patch.log=addLog(ex,"Updated from import"); await saveContact(r.id,patch); u++; } }
      else{ const {first,last}=splitName(r.name); const ut=r.school&&/texas at austin|mccombs/i.test(r.school); const c={name:r.name,first,last,firm:r.firm,firmId:r.firmId,title:r.title,location:r.location,linkedin:r.linkedin,school:r.school,ties:ut?[`${p.school} alum`]:[],stage:"lead",source:r.source,log:addLog({},`Added by ${r.source.toLowerCase()}`)};
        if((r.alts||[]).length) c.altEmails=r.alts;
        if(r.email){ c.email=r.email; c.emailSrc=r.emailSrc||"import"; } else { const g=guessEmail(c); if(g){ c.email=g; c.emailSrc="pattern"; } }
        await saveContact(r.id,c); n++; }
    }catch{}
    bulkStep(r.name);
  }
  bulkEnd(`${n} added${u?`, ${u} updated`:""}. Verify their emails on the People tab.`);
}

async function saveFile(filename,text){
  if(S.downloads){ try{ await S.downloads.save({filename,data:text}); return; }catch(e){ if(e?.code==="declined") return; } }
  openModal(`<div class="hd"><h2>${esc(filename)}</h2><button class="icon-btn" data-act="closeModal" aria-label="Close">×</button></div><p class="muted" style="margin:0">Copy this text and save it as a .csv file.</p><textarea class="in" rows="14" readonly id="exportText">${esc(text)}</textarea><div class="btn-row"><button class="btn primary" data-act="copyExport">Copy</button></div>`);
}
function exportCSV(){
  const list=S.tab==="people"&&(S.sel.size||S.pf.q||S.pf.firm||S.pf.email!=="all")?(S.sel.size?[...S.sel].map(id=>S.contacts[id]).filter(Boolean):filteredPeople()):Object.values(S.contacts);
  if(!list.length) return toast("No people to export yet.","ok");
  const cols=["Name","Title","Firm","Firm Type","Email","Email Status","Email Source","LinkedIn","Location","School","Shared Ties","Stage","Emailed","Replied","Call Notes"];
  const srcName={clay:"Clay",replied:"Confirmed by reply",import:"Import",manual:"Typed in",pattern:"Firm format guess"};
  const rows=list.map(c=>{const f=firmOf(c); return [c.name,c.title,f?.name||c.firm,f?TYPES[f.type]:"",c.email,emailStatus(c),srcName[c.emailSrc]||"",c.linkedin,c.location,c.school||(c.schools||[])[0]?.name||"",(c.ties||[]).join("; "),stageOf(c.stage).label,c.emailedAt?new Date(c.emailedAt).toISOString().slice(0,10):"",c.repliedAt?new Date(c.repliedAt).toISOString().slice(0,10):"",c.notes];});
  saveFile(`bankers-${new Date().toISOString().slice(0,10)}.csv`,[cols,...rows].map(r=>r.map(csvCell).join(",")).join("\n"));
}
/* Same columns as the sheet email_finder.py reads and writes, plus DeskId so rows match back on import.
   Confirmed emails go out filled (the script learns firm patterns from them); guesses go out blank so the script fills them. */
function exportFinder(){
  const list=Object.values(S.contacts); if(!list.length) return toast("No people yet.","ok");
  const cols=["Category","Firm","Name","Title","Location","Email","Source","LinkedIn","Note","Confidence","Alt Guess","DeskId"];
  const srcName={clay:"Clay",replied:"Confirmed by reply",import:"Import",manual:"Typed in"};
  const rows=list.map(c=>{const f=firmOf(c); const ok=c.email&&srcName[c.emailSrc]; const cat=f?TYPES[f.type]:"";
    return [cat==="Texas & regional"?"Regional (TX)":cat,f?.name||c.firm,c.name,c.title,c.location,ok?c.email:"",ok?srcName[c.emailSrc]:"",c.linkedin,(c.bounced||[]).length?`Bounced: ${c.bounced.join("; ")}`:"",ok?"Confirmed":"","",c.id];});
  saveFile("UT_Alumni_Bankers.csv",[cols,...rows].map(r=>r.map(csvCell).join(",")).join("\n"));
  toast("Run: python email_finder.py UT_Alumni_Bankers.csv  then import the same file back here.","ok");
}

  tjDelYes:async el=>{ const id=el.dataset.id; S.res.confirmDel=null; delete S.resumes[id]; if(S.res.sel===id) S.res.sel=null; S.res.tjDirty=false; dataChanged(); if(S.db) await S.db.collection("resumes").doc(id).delete().catch(e=>toast(dbErr(e),"crit")); updateTailor(true); },
  rsRun:()=>rsRun(),
  rsRetry:el=>rsRetry(Number(el.dataset.i)),
  rsDec:el=>{ const l=S.rs.lines[Number(el.dataset.i)]; if(!l) return; const k=el.dataset.k; l.decision=(l.decision===k&&k!=="edit")?"pending":k; if(k==="edit"&&!l.edited) l.edited=l.rewrite; rsPersist(); updateFixer(); },
  rsAcceptAll:()=>{ for(const l of S.rs.lines) if(l.rewrite&&(!l.decision||l.decision==="pending")) l.decision="accept"; rsPersist(); updateFixer(); },
  rsCopy:()=>copy(rsFinal()),
  rsAdopt:async()=>{ const t=rsFinal(); if(!t.trim()) return; await saveProfile({masterText:t.slice(0,30000)}); toast("Saved as your master resume.","ok"); },
  answersGen:async()=>{ const p=P(); const rt=masterText(); if(!rt) return toast("Fill in your master resume first.","warn"); setBusy("_answers","on");
    try{ const o=await askJSON(`Write first-person interview and application answers for a college student recruiting for ${p.focus}. Use only facts from the resume and profile; never invent experiences, numbers, or titles. Each answer 90 to 150 words, natural spoken tone, no em dashes, no hype words.

PROFILE
${meText()}

RESUME
${rt.slice(0,12000)}

Return only JSON: {"tellMe":"","whyIB":"","whyPC":"","whyBoutique":"","strength":"","weakness":"","team":"","lead":""}`);
      const clean={}; for(const k of ANS_Q.map(x=>x[0])) if(typeof o?.[k]==="string") clean[k]=tidy(o[k]).slice(0,2000);
      if(!S.db) return toast(NO_DB,"warn"); S.answers=clean; await S.db.doc("config/answers").set(clean); toast("Answers written. Edit before pasting.","ok"); }
    catch(e){ toast(e?.code?sampleErr(e):dbErr(e),"crit"); } finally{ setBusy("_answers",null); } },
  copyText:el=>copy((S.answers||{})[el.dataset.k]||""),
  copyExport:()=>copy($("#exportText")?.value||""),
  // settings
  saveSetup:async()=>{ await saveProfile(readSetup()); toast("Settings saved.","ok"); },
  checkConns:()=>checkConns(true),
  perms:async()=>{ try{ await S.perms.manage(); }catch{ toast("Open the page's Permissions menu in Claude to change access.","warn"); } checkConns(); },
  // contact file
  write:el=>{ const id=el.dataset.id; delete S.drafts[id+":"+(S.kind[id]||"cold")]; writeEmail(id,S.kind[id]||"cold"); },
  findEmail:el=>findEmail(el.dataset.id),
  guessOne:async el=>{ const c=S.contacts[el.dataset.id]; const g=guessEmail(c,c.bounced||[]); if(!g) return toast("Need a firm with an email domain and a full last name.","warn"); await saveContact(c.id,{email:g,emailSrc:"pattern"}); },
  gmailDraft:el=>mailDraft(el.dataset.id),
  copyDraft:el=>{ const d=curDraftFor(el.dataset.id); if(d) copy(`Subject: ${d.subject}\n\n${d.body}`); },
  prep:el=>prep(el.dataset.id),
  markTalked:async el=>{ const c=S.contacts[el.dataset.id]; S.kind[c.id]="thanks"; await saveContact(c.id,{stage:"talked",talkedAt:Date.now(),log:addLog(c,"Call done")}); toast("Logged. Write the thank-you while it's fresh.","ok"); },
  reparse:el=>reparse(el.dataset.id),
  clayHistory:el=>clayHistory(el.dataset.id),
  delAsk:el=>{ S.confirmDel=el.dataset.id; renderDrawer(true); },
  delNo:()=>{ S.confirmDel=null; renderDrawer(true); },
  delYes:async el=>{ const id=el.dataset.id; closeDrawer(); await deleteContact(id); toast("Removed.",""); },
};
const CHG = {
  dKind:el=>{ S.disc.kind=el.value; },
  dText:el=>{ S.disc.text=el.value; },
  dPlace:el=>{ S.disc.place=el.value; },
  dSize:el=>{ S.disc.size=el.value; },
  discPick:el=>{ el.checked?S.disc.picked.add(el.dataset.id):S.disc.picked.delete(el.dataset.id); updateDisc(); },
  pScope:el=>{ S.pfind.scope=el.value; },
  pfFirm:el=>{ S.pf.firm=el.value; updatePeople(); },
  selAll:el=>{ filteredPeople().slice(0,600).forEach(c=>el.checked?S.sel.add(c.id):S.sel.delete(c.id)); updatePeople(); },
  selRow:el=>{ el.checked?S.sel.add(el.dataset.id):S.sel.delete(el.dataset.id); updatePeople(); },
  oGuesses:el=>{ S.o.guesses=el.checked; updateOutreach(); },
  jFirm:el=>{ S.jobs.firm=el.value; updateJobs(); },
  jobStatus:async el=>{ const j=jobByKey(el.dataset.key); if(!j) return; const id="j-"+hashKey(j.key);
    if(!el.value){ if(S.apps[id]&&S.db){ delete S.apps[id]; dataChanged(); await S.db.collection("apps").doc(id).delete().catch(e=>toast(dbErr(e),"crit")); } return; }
    await trackJob(j.key,el.value); },
  taskDone:el=>{ const key=el.dataset.key;
    if(el.dataset.oneoff&&el.dataset.cid){ saveTask(el.dataset.cid,{doneAt:el.checked?Date.now():null}); return; }
    const done=dayDone().filter(d=>d.k!==key); if(el.checked) done.push({k:key,t:Date.now(),title:String(el.dataset.title||"").slice(0,160),...(el.dataset.ids?{ids:el.dataset.ids.split(",").filter(Boolean).slice(0,300)}:{})});
    saveDay({done:done.slice(-300)}); },
  appStatus:el=>saveApp(el.dataset.id,{status:el.value,...(el.value==="Applied"?{appliedAt:Date.now()}:{})}),
  tjPick:el=>{ S.res.job=el.value; $("#tjPasteWrap").hidden=$("#tjPasteMeta").hidden=el.value!=="_paste"; updateTailor(); },
  rsTarget:el=>{ S.rs.target=el.value; },
  kind:el=>{ const id=el.dataset.id, k=el.value; S.kind[id]=k; if((k==="fu1"||k==="fu2")&&!curDraft(id)) S.drafts[id+":"+k]=followupTemplate(S.contacts[id],k); renderDrawer(true); },
  stage:el=>{ const c=S.contacts[el.dataset.id]; const st=el.value; const patch={stage:st,log:addLog(c,`Moved to ${stageOf(st).label}`)}; const now=Date.now();
    if(st==="emailed"&&!c.emailedAt) Object.assign(patch,{emailedAt:now,lastSentAt:now}); if(st==="replied"&&!c.repliedAt) patch.repliedAt=now; if(st==="talked"&&!c.talkedAt) patch.talkedAt=now; if(st==="thanked"&&!c.thankedAt) patch.thankedAt=now;
    S.kind[c.id]=defaultKind({...c,...patch}); saveContact(c.id,patch); },
  csvFile:el=>{ const f=el.files?.[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const t=$("#bm-csv"); if(t){ t.value=String(r.result||""); csvParse(); } }; r.readAsText(f); },
  resumeFile:async el=>{ const f=el.files?.[0]; if(!f) return; if(!S.assets) return toast("Uploading works when this page is open in Claude with edit access.","warn"); if(f.size>8e5) return toast("That PDF is over 800 KB. Export a smaller one so it attaches cleanly.","warn");
    try{ const r=await S.assets.upload(f); await saveProfile({resume:{id:r.id,url:r.url,name:f.name,type:r.contentType||f.type||"application/pdf",size:r.sizeBytes}}); resumeCache={}; toast("Resume saved. It attaches to every cold email.","ok"); updateSetup(); }
    catch(e){ toast(`Upload failed (${e?.code||"error"}).`,"crit"); } },
};
const INP = {
  pq:el=>{ S.pf.q=el.value; updatePeople(); },
};
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("Copied.","ok"); }catch{ toast("Copy blocked here. Select the text and copy it manually.","warn"); } }

document.addEventListener("click",e=>{ const a=e.target.closest("a[data-compose]"); if(a) composeClick(a,e); },true);
document.addEventListener("click",e=>{ const el=e.target.closest("[data-act]"); if(!el) return; if(el.tagName==="A"&&!el.dataset.act) return; const fn=ACT[el.dataset.act]; if(fn){ if(el.tagName==="BUTTON"||el.tagName==="A") e.preventDefault(); fn(el,e); } });
document.addEventListener("change",e=>{ const el=e.target.closest("[data-chg]"); if(el&&CHG[el.dataset.chg]) CHG[el.dataset.chg](el,e);
  const fld=e.target.closest("[data-field]"); if(fld){ const id=fld.dataset.id, k=fld.dataset.field; const c=S.contacts[id]; if(!c) return; let v=fld.value;
    if(k==="callAt"){ v=v?new Date(v).getTime():null; const patch={callAt:v}; if(v&&["lead","drafted","emailed","fu1","fu2","replied"].includes(c.stage)){ patch.stage="scheduled"; patch.log=addLog(c,`Call set for ${fmtDT(v)}`); } saveContact(id,patch); return; }
    if(k==="email"){ v=v.trim().toLowerCase(); if(v&&!EMAIL_RE.test(v)) return toast("That doesn't look like an email address.","warn"); saveContact(id,{email:v,emailSrc:v?"manual":""}); return; }
    saveContact(id,{[k]:v}); }
  const dft=e.target.closest("[data-draft]"); if(dft){ const id=dft.dataset.id; const k=S.kind[id]||"cold"; const d={...(curDraft(id)||{kind:k,subject:"",body:""}),[dft.dataset.draft]:dft.value,kind:k}; S.drafts[id+":"+k]=d; if(k!=="fu1"&&k!=="fu2") saveContact(id,{draft:d}).catch(()=>{}); }
});
document.addEventListener("input",e=>{ const el=e.target.closest("[data-inp]"); if(el&&INP[el.dataset.inp]) INP[el.dataset.inp](el,e);
  const t=e.target;
  if(t.id==="rz-master"){ S.res.masterDirty=true; clearTimeout(INP._rz); INP._rz=setTimeout(updateMaster,250); }
  if(t.id==="tj-text"){ S.res.tjDirty=true; clearTimeout(INP._tj); INP._tj=setTimeout(()=>{ const p=$("#tjPrev"); if(p) p.innerHTML=rzHTML(t.value); },250); }
  if(t.dataset.bi!=null){ const it=S.batch[Number(t.dataset.bi)]; if(it){ it[t.dataset.bf]=t.value; saveBatchLocal(); } }
  const rse=t.closest("[data-rsedit]"); if(rse){ const l=S.rs.lines[Number(rse.dataset.rsedit)]; if(l){ l.edited=rse.value; rsPersist(); const fin=$("#rsFinal .final"); if(fin) fin.textContent=rsFinal(); } }
  const dft=t.closest("[data-draft]"); if(dft){ const id=dft.dataset.id; const k=S.kind[id]||"cold"; S.drafts[id+":"+k]={...(curDraft(id)||{kind:k,subject:"",body:""}),[dft.dataset.draft]:dft.value,kind:k}; } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(!$("#modal").hidden) closeModal(); else if(S.open) closeDrawer(); } if(e.key==="Enter"&&e.target.id==="fAddName"){ e.preventDefault(); ACT.firmQuickAdd(); } if(e.key==="Enter"&&e.target.id==="tdNew"&&!e.isComposing){ e.preventDefault(); ACT.taskAdd(); } });
document.getElementById("drawer").addEventListener("focusout",e=>{ if(S.drawerDirty&&!$("#drawer").contains(e.relatedTarget)) setTimeout(()=>renderDrawer(),0); });
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
window.addEventListener("beforeunload",e=>{ if(S.res.masterDirty||S.res.tjDirty){ e.preventDefault(); e.returnValue=""; } });

/* ---------- boot ---------- */
async function checkConns(manual){
  const all=["Clay","Gmail",MS,"Indeed"];
  if(!S.mcp){ for(const n of all) S.conn[n]="missing"; renderConns(); if(S.tab==="settings") updateSetup(); return; }
  try{ const r=await S.mcp.listTools(); const by={}; for(const s of r?.servers||[]) by[s.server]=s;
    for(const n of all){ const s=by[n]; S.conn[n]=!s?"missing":s.authStatus==="needs_reauth"?"reauth":(s.tools||[]).length?"ok":"missing"; } }
  catch{ if(manual) toast("Couldn't read connector status.","warn"); }
  renderConns(); if(S.tab==="settings") updateSetup();
}
function subscribe(){
  const db=S.db; const fail=name=>e=>toast(`Couldn't load ${name} (${e?.code||"error"}). Reload the page.`,"crit");
  db.collection("contacts").onSnapshot(s=>{ const m={}; for(const d of s.docs) if(d.exists) m[d.id]={...d.data(),id:d.id}; S.contacts=m; S.ready.contacts=true; dataChanged(); },fail("people"));
  db.collection("targets").onSnapshot(s=>{ const m={}; for(const d of s.docs) if(d.exists) m[d.id]={...d.data()}; S.targets=m; S.ready.targets=true; rebuildFirms(); dataChanged(); },fail("firms"));
  db.collection("apps").onSnapshot(s=>{ const m={}; for(const d of s.docs) if(d.exists) m[d.id]={...d.data(),id:d.id}; S.apps=m; S.ready.apps=true; dataChanged(); },fail("applications"));
  db.collection("resumes").onSnapshot(s=>{ const m={}; for(const d of s.docs) if(d.exists) m[d.id]={...d.data(),id:d.id}; S.resumes=m; S.ready.resumes=true; dataChanged(); },()=>{ S.ready.resumes=true; });
  db.collection("jobs").onSnapshot(s=>{ const m={}; for(const d of s.docs) if(d.exists) m[d.id]={...d.data()}; for(const [k,v] of Object.entries(S.firmJobs)) if(!m[k]||(v.pulledAt||0)>(m[k].pulledAt||0)) m[k]=v; S.firmJobs=m; S.ready.jobs=true; dataChanged(); },()=>{ S.ready.jobs=true; });
  db.doc("config/profile").onSnapshot(d=>{ S.profile=d.exists?d.data():null; const first=!S.ready.profile; S.ready.profile=true; if(first) mountView(); dataChanged(); },fail("profile"));
  db.doc("config/answers").onSnapshot(d=>{ S.answers=d.exists?d.data():null; dataChanged(); },()=>{});
  db.doc("config/lastRun").onSnapshot(d=>{ S.lastRun=d.exists?d.data():null; dataChanged(); },()=>{});
  db.doc("config/resumeReview").onSnapshot(d=>{ if(d.exists&&!S.rs.running&&!S.rs.dirty){ const v=d.data(); S.rs.lines=Array.isArray(v.lines)?v.lines:[]; S.rs.overall=v.overall||null; S.rs.keywords=v.keywords||[]; S.rs.target=v.target||S.rs.target; dataChanged(); } },()=>{});
  db.collection("tasks").onSnapshot(s=>{ const m={}; for(const d of s.docs) if(d.exists) m[d.id]={...d.data(),id:d.id}; S.tasks=m; S.ready.tasks=true; dataChanged(); },()=>{ S.ready.tasks=true; });
  subDay();
}
async function boot(){
  lsSet("cd.tab",S.tab); lsSet("cd.tabDay",S.dayKey); try{ history.replaceState(null,"","#"+S.tab); }catch{}
  renderTabs(); renderConns(); mountView();
  const use=n=>(window.claude&&typeof window.claude.use==="function")?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,mcp,sample,assets,downloads,perms]=await Promise.all(["db","mcp","sample","assets","downloads","permissions"].map(use));
  Object.assign(S,{db,mcp,sample,assets,downloads,perms,booted:true});
  if(db) subscribe(); else { Object.keys(S.ready).forEach(k=>S.ready[k]=true); }
  mountView(); checkConns();
}
boot();

</script>
