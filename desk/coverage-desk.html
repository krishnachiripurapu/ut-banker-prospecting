<title>Coverage Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a pitchbook sheet. Slim masthead, Excel-style sheet tabs, one working surface per tab,
   and a contact file that slides in from the right. Blue text marks values you typed, like hardcodes in a model. */
:root{
  --paper:#F3F5F8; --sheet:#FFFFFF; --sheet-2:#F8F9FB; --ink:#0F1B2D; --ink-2:#465264; --ink-3:#717D91;
  --rule:#D9DFE7; --rule-2:#E9EDF2;
  --accent:#BF5700; --accent-2:#9E4800; --accent-soft:#FBEBDD; --on-accent:#FFFFFF;
  --hard:#1C4ED8; --hard-soft:#E7EEFE;
  --ok:#17784A; --ok-soft:#E0F2E8; --warn:#9A6200; --warn-soft:#FBF0D6; --crit:#BD3328; --crit-soft:#FBE4E1;
  --scrim:rgba(15,27,45,.38);
  --shadow:0 1px 2px rgba(15,27,45,.06),0 12px 32px rgba(15,27,45,.12);
  --f-ui:"Archivo",Arial,Helvetica,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C121C; --sheet:#131B27; --sheet-2:#18212F; --ink:#E6EBF2; --ink-2:#A9B4C4; --ink-3:#818DA0;
  --rule:#273345; --rule-2:#1E2836;
  --accent:#F08A3C; --accent-2:#FFA160; --accent-soft:#3A2414; --on-accent:#1A0E04;
  --hard:#8EAEFF; --hard-soft:#1B2645;
  --ok:#4CC48A; --ok-soft:#12301F; --warn:#E5AE4E; --warn-soft:#33270F; --crit:#F2766B; --crit-soft:#3A1915;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C121C; --sheet:#131B27; --sheet-2:#18212F; --ink:#E6EBF2; --ink-2:#A9B4C4; --ink-3:#818DA0;
  --rule:#273345; --rule-2:#1E2836;
  --accent:#F08A3C; --accent-2:#FFA160; --accent-soft:#3A2414; --on-accent:#1A0E04;
  --hard:#8EAEFF; --hard-soft:#1B2645;
  --ok:#4CC48A; --ok-soft:#12301F; --warn:#E5AE4E; --warn-soft:#33270F; --crit:#F2766B; --crit-soft:#3A1915;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--hard)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
h1,h2,h3{font-variation-settings:"wdth" 80;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:22px;font-weight:760}
h3{font-size:15px;font-weight:720}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--hard);outline-offset:2px}

/* masthead + sheet tabs */
.mast{background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.mast-in{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:4px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.02em;flex:none}
.brand .name{font-weight:780;font-size:17px;font-variation-settings:"wdth" 78;letter-spacing:.01em;line-height:1.1}
.brand .sub{font-size:11px;color:var(--ink-3)}
.mast-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.conns{display:flex;gap:10px;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.conn{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
.tabs-scroll{overflow-x:auto;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;align-items:flex-end;min-width:max-content}
.tab{appearance:none;border:1px solid transparent;border-bottom:none;background:none;color:var(--ink-2);font:inherit;font-weight:620;padding:9px 14px 10px;border-radius:6px 6px 0 0;cursor:pointer;display:flex;gap:6px;align-items:center;margin-bottom:-1px}
.tab:hover{color:var(--ink);background:var(--sheet-2)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--rule);box-shadow:inset 0 2px 0 var(--accent)}
.tab .ct{font-family:var(--f-mono);font-size:11px;background:var(--accent-soft);color:var(--accent-2);border-radius:9px;padding:0 6px;min-width:18px;text-align:center}

main{padding-block:20px 80px}
.banner{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.crit{background:var(--crit-soft);border-color:transparent}

/* controls */
.btn{appearance:none;font:inherit;font-weight:620;font-size:13px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:7px 12px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{appearance:none;border:none;background:none;color:var(--ink-2);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:var(--r)}
.icon-btn:hover{background:var(--sheet-2);color:var(--ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.in{font:inherit;font-size:13px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.in:focus{border-color:var(--hard);outline:none;box-shadow:0 0 0 3px var(--hard-soft)}
.in.hard,textarea.in,input.in[type="text"],input.in[type="email"],input.in[type="url"],input.in[type="number"],input.in[type="date"],input.in[type="datetime-local"],input.in:not([type]){color:var(--hard)}
select.in{color:var(--ink);width:auto}
textarea.in{resize:vertical;line-height:1.5}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);min-width:0}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font:inherit;font-size:12px;font-weight:600;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);border-radius:14px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:4px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--sheet-2);border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
.tag.tie{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.tag.t-BB{color:var(--ink-2)}.tag.t-EB{color:var(--accent-2)}.tag.t-MM{color:var(--ink-2)}.tag.t-TX{color:var(--warn)}.tag.t-PC{color:var(--ok)}
.rs-row{display:grid;grid-template-columns:4px minmax(0,1fr) minmax(0,1fr);gap:12px;padding:10px 12px 10px 0;border-top:1px solid var(--rule-2);align-items:start}
.rs-row .stripe{align-self:stretch;border-radius:0 2px 2px 0;background:var(--c,var(--rule))}
.rs-row .orig{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.rs-row .sugg{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--hard)}
.rs-row.done .orig{color:var(--ink-3);text-decoration:line-through}
.rs-row.kept .sugg{color:var(--ink-3);text-decoration:line-through}
@media (max-width:620px){.rs-row{grid-template-columns:4px minmax(0,1fr)}.rs-row .sugg-col{grid-column:2}}
.final{white-space:pre-wrap;font-size:12.5px;line-height:1.5;background:var(--sheet-2);border:1px solid var(--rule-2);border-radius:var(--r);padding:12px;max-height:620px;overflow:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:620;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--ink-3))}
.g-reach{--c:var(--ink-3)}.g-wait{--c:var(--warn)}.g-engaged{--c:var(--accent)}.g-done{--c:var(--ok)}.g-closed{--c:var(--rule)}
.src{font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.src.v{color:var(--ok)}.src.g{color:var(--warn)}.src.x{color:var(--ink-3)}

/* surfaces */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.card-b{padding:0 16px 16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:12px;color:var(--ink-3);margin:6px 0 0}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty h3{margin-bottom:6px;color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--rule);background:var(--sheet-2);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sheet-2)}
.tbl .nm{font-weight:660}
.tbl .sub{font-size:12px;color:var(--ink-2)}
.tbl .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl td.cb,.tbl th.cb{width:30px}

/* today */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule-2)}
.kpi{background:var(--sheet);padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.kpi .l{font-size:12px;color:var(--ink-2);margin-top:2px}
.meter{height:4px;background:var(--rule-2);border-radius:2px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.funnel{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--rule-2);margin:4px 0 10px}
.funnel i{display:block;height:100%;background:var(--c)}
.legend{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12px}
.todo{display:flex;flex-direction:column}
.todo-row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px 10px 0;border-top:1px solid var(--rule-2)}
.todo-row:first-child{border-top:none}
.todo-row .stripe{align-self:stretch;border-radius:0 2px 2px 0;background:var(--c,var(--rule))}
.todo-row .what{min-width:0}
.todo-row .who{font-weight:660;cursor:pointer}
.todo-row .who:hover{text-decoration:underline}
.todo-row .meta{font-size:12px;color:var(--ink-2)}
.sev-crit{--c:var(--crit)}.sev-warn{--c:var(--warn)}.sev-ok{--c:var(--ok)}.sev-info{--c:var(--ink-3)}.sev-hot{--c:var(--accent)}
.group-h{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--rule)}
.group-h:first-child{border-top:none}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet-2)}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-weight:600;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);font-size:12px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--sheet);border-left:1px solid var(--rule);box-shadow:var(--shadow);z-index:41;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) 20px}
.dr-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dr-head h2{margin:2px 0}
.dr-bar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:14px 0}
.next{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--sheet-2);border-left:4px solid var(--c,var(--rule));margin-bottom:6px;flex-wrap:wrap}
.dr-sec{border-top:1px solid var(--rule);padding-top:16px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.dr-sec h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field-row{display:flex;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg-b{appearance:none;font:inherit;font-size:12px;font-weight:600;padding:5px 9px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);cursor:pointer}
.seg-b.on{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
.prep{white-space:pre-wrap;font-size:13px;background:var(--sheet-2);border-radius:var(--r);padding:12px;border:1px solid var(--rule-2)}
.log{display:flex;flex-direction:column;gap:4px;font-size:12px}
.log div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--ink-2);font-size:12px;font-weight:600}
.pretext{white-space:pre-wrap;font-size:12px;color:var(--ink-2);max-height:240px;overflow:auto;background:var(--sheet-2);padding:10px;border-radius:var(--r);margin-top:6px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--sheet);border-radius:8px;box-shadow:var(--shadow);width:min(760px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.progress-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.progress-list li{display:flex;gap:8px;align-items:center}
.progress-list li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--rule);flex:none}
.progress-list li.run::before{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.progress-list li.done::before{background:var(--ok);border-color:var(--ok)}
.progress-list li.fail::before{background:var(--crit);border-color:var(--crit)}
.progress-list li.skip{color:var(--ink-3)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.progress-list li.run::before{animation:none}}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.form-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.form-grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.form-grid,.form-grid.four{grid-template-columns:minmax(0,1fr)}}

/* toasts + bulk bar */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:var(--r);font-size:13px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.toast a{color:inherit;font-weight:700}
.toast.crit{background:var(--crit);color:#fff}
.toast.warn{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:55;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.bulkbar .meter{width:140px;margin:0}
.skel{height:14px;border-radius:3px;background:var(--rule-2);margin:10px 16px}
</style>

<header class="mast">
  <div class="wrap mast-in">
    <div class="brand"><span class="mark" aria-hidden="true">CD</span><div><div class="name">Coverage Desk</div><div class="sub mono" id="mastSub">Networking and recruiting desk</div></div></div>
    <div class="mast-actions">
      <div class="conns" id="conns"></div>
      <button class="btn" data-act="bulkOpen">Bulk add</button>
      <button class="btn primary" data-act="pasteOpen">Paste LinkedIn profile</button>
    </div>
  </div>
  <div class="wrap tabs-scroll"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>
<main class="wrap" id="main"></main>
<div class="scrim" id="scrim" hidden data-act="closeDrawer"></div>
<aside class="drawer" id="drawer" hidden aria-label="Contact file"></aside>
<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>
<div class="bulkbar" id="bulkbar" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* ---------- reference data ---------- */
const LIB = [
  ["gs","Goldman Sachs","BB","goldmansachs.com","gs.com","first.last","common",["goldman"]],
  ["ms","Morgan Stanley","BB","morganstanley.com","morganstanley.com","first.last","common",["morgan stanley"]],
  ["jpm","J.P. Morgan","BB","jpmorganchase.com","jpmorgan.com","first.last","common",["j\\.?\\s?p\\.?\\s?morgan","jpmorgan"]],
  ["bofa","BofA Securities","BB","bankofamerica.com","bofa.com","first.last","common",["bank of america","\\bbofa\\b"]],

function rebuildFirms(){
  const out = LIB.map(f=>{ const t=S.targets[f.id]||{}; return {...f, ...(t.over||{}), on:!!t.on, tier:t.tier||2, tx:t.tx||"", mynote:t.note||"", rx:f.m.map(p=>new RegExp(p,"i"))}; });
  for (const [id,t] of Object.entries(S.targets)) if (t.custom && t.name) {
    const nm=String(t.name); const rx=(Array.isArray(t.m)&&t.m.length?t.m:[nm.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")]).map(p=>{try{return new RegExp(p,"i");}catch{return null;}}).filter(Boolean); out.push({id,name:nm,type:t.type||"MM",domain:t.domain||"",mail:t.mail||t.domain||"",pat:t.pat||"first.last",careers:t.careers||"",tx:t.tx||"",mynote:t.note||"",conf:"verify",on:!!t.on,tier:t.tier||2,custom:true,rx});
  }
  FIRMS = out;
}
function matchFirm(name){ const n=String(name||"").trim(); if(!n) return null; return FIRMS.find(f=>f.rx.some(r=>r.test(n))) || null; }
function firmById(id){ return FIRMS.find(f=>f.id===id) || null; }
function firmOf(c){ return (c.firmId && firmById(c.firmId)) || matchFirm(c.firm); }
function trackFor(firm){ return firm?.type==="PC" ? {long:"private credit",short:"Private Credit"} : {long:"investment banking",short:"IB"}; }
function inferPattern(email,first,last){ const local=String(email||"").toLowerCase().split("@")[0]; const f=normName(first), l=normName(last); if(!f||!l) return null; return PAT_ORDER.find(p=>PATS[p](f,l)===local) || null; }
function buildIndex(){
  const byFirm={}, ok={}, bad={};
  for (const c of Object.values(S.contacts)) {
    const f=firmOf(c); if(!f) continue; (byFirm[f.id] ||= []).push(c);
    if (c.email && ["clay","import","replied","manual"].includes(c.emailSrc)) { const p=inferPattern(c.email,c.first,c.last); if(p){ ok[f.id] ||= {}; ok[f.id][p]=(ok[f.id][p]||0)+1; } }
    for (const b of (c.bounced||[])) { const p=inferPattern(b,c.first,c.last); if(p){ bad[f.id] ||= {}; bad[f.id][p]=(bad[f.id][p]||0)+1; } }
  }
  const pat={};
  for (const f of FIRMS) {
    const o=ok[f.id]||{}, b=bad[f.id]||{};
    const best=Object.entries(o).sort((x,y)=>y[1]-x[1])[0];
    if (best) pat[f.id]={pat:best[0],why:`confirmed by ${best[1]} verified email${best[1]>1?"s":""}`,lvl:"v",bad:b};
    else if ((b[f.pat]||0)>=2) { const alt=PAT_ORDER.find(p=>!b[p])||f.pat; pat[f.id]={pat:alt,why:`${f.pat} bounced ${b[f.pat]} times, now trying ${alt}`,lvl:"g",bad:b}; }
    else pat[f.id]={pat:f.pat,why:f.conf==="common"?"widely reported format":"best guess, not yet confirmed",lvl:f.conf==="common"?"v":"g",bad:b};
  }
  S.idx={byFirm,pat};
}
function guessEmail(c,avoid=[]){
  const firm=firmOf(c); const f=normName(c.first), l=normName(c.last);
  if(!firm||!firm.mail||!f||l.length<2) return "";
  const info=S.idx.pat[firm.id]||{pat:firm.pat,bad:{}};
  const order=[info.pat,...PAT_ORDER.filter(p=>p!==info.pat&&!(info.bad||{})[p])];
  const av=avoid.map(x=>String(x).toLowerCase());
  for (const p of order){ const e=PATS[p](f,l)+"@"+firm.mail; if(!av.includes(e)) return e; }
  return "";
}

/* ---------- capability helpers ---------- */
const NO_DB = "Saving needs this page open in Claude.";
function enqueue(key,fn){ const q=(enqueue.q ||= {}); const p=(q[key]||Promise.resolve()).catch(()=>{}).then(fn); q[key]=p; return p; }
function dbErr(e){ switch(e?.code){ case "quota_exceeded": return "Storage is full. Delete closed contacts to make room."; case "invalid_argument": return "Couldn't save. You may only have view access to this page."; case "resource_exhausted": return "Too many saves at once. Wait a moment and try again."; default: return `Couldn't save (${e?.code||"error"}). Try again.`; } }
async function saveContact(id,patch){
  if(!S.db){ toast(NO_DB,"warn"); throw {code:"no_db"}; }
  const exists=!!S.contacts[id]?.createdAt;
  const clean=JSON.parse(JSON.stringify(patch));
  const body = exists ? clean : {createdAt:Date.now(), ...clean};
  S.contacts[id]={...(S.contacts[id]||{}),...body,id}; dataChanged();
  const ref=S.db.collection("contacts").doc(id);
  return enqueue("c:"+id,()=>exists?ref.update(clean):ref.set({...body})).catch(e=>{toast(dbErr(e),"crit");throw e;});
}
async function deleteContact(id){ if(!S.db) return toast(NO_DB,"warn"); delete S.contacts[id]; S.sel.delete(id); dataChanged(); return enqueue("c:"+id,()=>S.db.collection("contacts").doc(id).delete()).catch(e=>toast(dbErr(e),"crit")); }
async function saveTarget(id,patch){ if(!S.db) return toast(NO_DB,"warn"); const cur=S.targets[id]||{}; const body={...cur,...JSON.parse(JSON.stringify(patch))}; S.targets[id]=body; rebuildFirms(); dataChanged(); return enqueue("t:"+id,()=>S.db.collection("targets").doc(id).set(body)).catch(e=>toast(dbErr(e),"crit")); }
async function saveApp(id,patch){ if(!S.db) return toast(NO_DB,"warn"); const cur=S.apps[id]||{createdAt:Date.now()}; const body={...cur,...JSON.parse(JSON.stringify(patch))}; delete body.id; S.apps[id]={...body,id}; dataChanged(); return enqueue("a:"+id,()=>S.db.collection("apps").doc(id).set(body)).catch(e=>toast(dbErr(e),"crit")); }
async function saveProfile(patch){ if(!S.db) return toast(NO_DB,"warn"); const body={...P(),...JSON.parse(JSON.stringify(patch))}; S.profile=body; dataChanged(); return enqueue("profile",()=>S.db.doc("config/profile").set(body)).catch(e=>toast(dbErr(e),"crit")); }
async function call(server,tool,input,opts){
  if(!S.mcp) throw {code:"no_mcp",message:"Connectors work when this page is open in Claude."};
  const r=await S.mcp.callTool(server,tool,input,opts);
  return r && "payload" in r ? r.payload : r;
}
function errText(e,server){
  switch(e?.code){
    case "no_mcp": return e.message;
    case "needs_reauth": return `Reconnect ${server} in claude.ai Settings → Connectors.`;
    case "server_not_connected": case "server_not_found": return `Add the ${server} connector in claude.ai Settings → Connectors.`;
    case "selection_required": return `Pick which ${server} connector to use when claude.ai asks, then try again.`;
    case "not_in_manifest": return `${server} is turned off for this page. Turn it on from the page's Permissions menu.`;
    case "blocked_by_policy": return `Your organization blocks this ${server} tool.`;
    case "approval_required": case "consent_required": return `${server} needs your approval. Click again and choose Allow.`;
    case "server_unavailable": return `${server} didn't answer. Try again in a minute.`;
    case "tool_error": return `${server}: ${String(e.message||"the request failed").slice(0,180)}`;
    case "cancelled": return "Stopped.";
    default: return `${server} request failed (${e?.code||"error"}).`;
  }
}
function sampleErr(e){
  switch(e?.code){
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": return "Claude access is off for this page. Turn it on from the page's Permissions menu.";
    case "rate_limited": return "You've hit your Claude usage limit for now. Try again later.";
    case "refused": return "Claude declined this one. Change the input and try again.";
    case "invalid_json": return "Claude's answer came back in the wrong format. Try again.";
    case "prompt_too_large": return "That text is too long. Paste a shorter section.";
    case "session_expired": return "Sign in to Claude again, then retry.";
    case "cancelled": return "Stopped.";
    case "no_sample": return "Writing needs this page open in Claude.";
    default: return `Claude didn't finish (${e?.code||"error"}). Try again.`;
  }
}
async function ask(prompt,opts={}){ if(!S.sample) throw {code:"no_sample"}; return S.sample(prompt,{cache:false,...opts}); }
async function askJSON(prompt,opts={}){ if(!S.sample) throw {code:"no_sample"}; return S.sample.json(prompt,{cache:false,...opts}); }

/* ---------- toasts / bulk ---------- */
function toast(msg,kind="",link){ if(!msg) return; const el=document.createElement("div"); el.className="toast "+kind; el.innerHTML=`<span>${esc(msg)}</span>${safeUrl(link)?`<a href="${esc(link)}" target="_blank" rel="noopener">Open ↗</a>`:""}`; $("#toasts").append(el); setTimeout(()=>el.remove(), kind==="crit"?9000:5500); }
function bulkStart(label,total){ S.bulk={label,total,done:0,stop:false,note:""}; renderBulk(); return S.bulk; }
function bulkStep(note){ if(!S.bulk) return; S.bulk.done++; if(note) S.bulk.note=note; renderBulk(); }
function bulkEnd(msg){ S.bulk=null; renderBulk(); if(msg) toast(msg,"ok"); }
function renderBulk(){ const el=$("#bulkbar"); const b=S.bulk; if(!b){ el.hidden=true; return; } el.hidden=false; const pct=b.total?Math.round(100*b.done/b.total):0;
  el.innerHTML=`<strong>${esc(b.label)}</strong><span class="mono">${b.done} / ${b.total}</span><div class="meter"><i style="width:${pct}%"></i></div><span class="faint" style="font-size:12px">${esc(b.note||"")}</span><button class="btn sm" data-act="bulkStop">${b.stop?"Stopping…":"Stop"}</button>`; }

/* ---------- next actions ---------- */
function nextAction(c,now=Date.now()){
  const fu=(Number(P().followUpDays)||6)*DAY;
  switch(c.stage||"lead"){
    case "lead": return c.email ? {label:"Write the cold email",due:c.createdAt||now,sev:"info",act:"compose",kind:c.referrer?"referral":"cold"} : {label:"Find an email",due:null,sev:"info",act:"findEmail"};
    case "drafted": return {label:"Send your Gmail draft",due:c.draftedAt||now,sev:"warn",act:"gmailLink"};
    case "emailed": return {label:"Send follow-up 1",due:(c.lastSentAt||c.emailedAt||now)+fu,sev:"warn",act:"compose",kind:"fu1"};
    case "fu1": return {label:"Send the final follow-up",due:(c.lastSentAt||now)+fu,sev:"warn",act:"compose",kind:"fu2"};
    case "fu2": return {label:"No reply. Close it out",due:(c.lastSentAt||now)+fu,sev:"info",act:"close"};
    case "replied": return {label:"Reply and set a time",due:c.repliedAt||now,sev:"hot",act:"open"};
    case "scheduled": return c.callAt && c.callAt<now ? {label:"Log how the call went",due:c.callAt,sev:"hot",act:"open"} : {label:"Prep for the call",due:c.callAt?c.callAt-DAY:now,sev:"hot",act:"prep"};
    case "talked": return {label:"Send a thank-you",due:c.talkedAt||now,sev:"crit",act:"compose",kind:"thanks"};
    case "thanked": case "advocate": return {label:"Check in with an update",due:(c.thankedAt||c.talkedAt||now)+35*DAY,sev:"ok",act:"compose",kind:"checkin"};
    default: return null;
  }
}

async function pullFirmJobs(f){
  const name=INDEED_Q[f.id]||f.name;
  const qs=f.type==="PC"?[`${name} credit`,`${name} analyst`]:[`${name} investment banking`,`${name} analyst`];
  const items=[], seen=new Set(); const nmRx=new RegExp("\\b"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
  for(const q of qs){
    const r=await call("Indeed","search_jobs",{search:q,location:"United States",country_code:"US"},{cache:{staleTime:300000,gcTime:6*3600000}});
    for(const x of parseIndeed(r)){
      if(!x.title) continue; const m=matchFirm(x.company);
      if(!((m&&m.id===f.id)||(!m&&nmRx.test(String(x.company||""))))) continue;
      const k=(x.url||x.title).toLowerCase(); if(seen.has(k)) continue; seen.add(k);
      items.push({...x,...classifyJob(x.title,f)});
    }
  }
  items.sort((a,b)=>(Date.parse(b.posted)||0)-(Date.parse(a.posted)||0));
  const body={pulledAt:Date.now(),items:items.slice(0,40)};
  S.firmJobs[f.id]=body; if(S.db) enqueue("j:"+f.id,()=>S.db.collection("jobs").doc(f.id).set(body)).catch(()=>{});
  return items;
}
async function pullJobs(ids,quiet){
  const firms=(ids||FIRMS.filter(f=>f.on).map(f=>f.id)).map(firmById).filter(Boolean); if(!firms.length) return;
  S.jobs.pulling=true; S.jobs.pullErrs=[]; updateView();
  const b=bulkStart("Pulling jobs from Indeed",firms.length); let roles=0, intern=0;
  for(const f of firms){ if(b.stop) break;
    try{ const items=await pullFirmJobs(f); roles+=items.filter(j=>j.cat==="IB"||j.cat==="PC").length; intern+=items.filter(j=>j.level==="Intern").length; }
    catch(e){ S.jobs.pullErrs.push(`${f.name}: ${errText(e,"Indeed")}`); if(/needs_reauth|server_not|not_in_manifest|no_mcp|blocked|selection_required|approval_required/.test(e?.code||"")) break; }
    bulkStep(f.name); if(S.tab==="jobs") updateJobs();
  }
  S.jobs.pulling=false; bulkEnd(); updateView();
  if(!quiet||roles) toast(`Found ${roles} IB and private credit role${roles===1?"":"s"}${intern?`, ${intern} internship${intern===1?"":"s"}`:""} across ${firms.length} firm${firms.length===1?"":"s"}.`,"ok");
}
async function maybeAutoPull(){
  if(S.jobs.autoPulled||S.jobs.pulling||!S.mcp||!S.perms||!S.ready.jobs) return; S.jobs.autoPulled=true;
  const tgt=FIRMS.filter(f=>f.on); if(!tgt.length) return;
  const stale=tgt.filter(f=>!S.firmJobs[f.id]||Date.now()-(S.firmJobs[f.id].pulledAt||0)>24*3600e3); if(!stale.length) return;
  try{ if(await S.perms.state("mcp:Indeed")==="granted") pullJobs(stale.map(f=>f.id),true); }catch{}
}
function parseIndeed(md){
  const text=typeof md==="string"?md:(md?.result??md?.text??JSON.stringify(md||""));
  return String(text).split(/\*\*Job Title:\*\*/).slice(1).map(b=>{ const g=k=>{const m=b.match(new RegExp("\\*\\*"+k+":\\*\\*\\s*([^\\n]+)"));return m?m[1].trim():"";}; const url=(g("View Job URL").match(/https?:\/\/\S+/)||[""])[0]; return {title:b.split("\n")[0].trim(),company:g("Company"),location:g("Location"),posted:g("Posted on"),type:g("Job Type"),pay:g("Compensation"),url}; });
}
async function runJobs(){
  const combos=[]; for(const id of S.jobs.presets) for(const loc of S.jobs.locs) combos.push([JOB_PRESETS.find(j=>j.id===id),loc]);
  Object.assign(S.jobs,{running:true,results:[],errs:[],done:false}); updateJobs();
  for(const [j,loc] of combos){
    try{ const input={search:j.q,location:loc,country_code:"US"}; if(j.type) input.job_type=j.type;
      const r=await call("Indeed","search_jobs",input,{cache:{staleTime:300000,gcTime:6*3600000}});
      for(const x of parseIndeed(r)){ if(!x.title) continue; const k=(x.url||x.title+x.company).toLowerCase(); if(S.jobs.results.some(y=>(y.url||y.title+y.company).toLowerCase()===k)) continue; const f=matchFirm(x.company); x.firmId=f?.id||""; Object.assign(x,classifyJob(x.title,f)); x.key="s|"+k; S.jobs.results.push(x); }
    }catch(e){ if(!S.jobs.errs.length) S.jobs.errs.push(errText(e,"Indeed")); }
    updateJobs();
  }
  S.jobs.results.sort((a,b)=>(b.firmId?1:0)-(a.firmId?1:0)); S.jobs.running=false; S.jobs.done=true; updateJobs();
}

const RS_RULES = `- One page. For students, Education comes first: school, degree, expected graduation month and year, GPA if 3.5 or higher, honors, relevant coursework.
- Each experience bullet starts with a strong action verb, past tense for past roles and present tense for a current role. No "I", "responsible for", "helped", "assisted with", "worked on", "various", "duties included".
- Show results with numbers: dollar amounts, percentages, counts, time saved, assets covered. NEVER invent a number, client, deal or fact. If a number would make the line stronger but is not given, put a bracketed placeholder such as [$X] or [#] and say in "why" what real number to fill in.
- Name real finance work only where the line supports it: DCF, LBO, comparable companies, precedent transactions, three-statement model, credit memo, covenant or leverage analysis, pitch materials, due diligence.
- Aim for one printed line, about 100 to 115 characters. Two lines at most. Cut filler and repeated words.
- Keep tense, date format and punctuation consistent across the page.
- Activities and leadership: say what you built, led or grew, and the result.
- Skills line: hard skills only (Excel, PowerPoint, Capital IQ, FactSet, Bloomberg, PitchBook, Python, SQL), languages, and two or three specific interests that start conversations.`;

${lines.map(l=>`${l.n}: ${l.text}`).join("\n")}`,{modelTier:"default"});

    (c.schools||[]).length?`Schools: ${c.schools.map(s=>[s.name,s.degree,s.years].filter(Boolean).join(", ")).join(" | ")}`:(c.school&&`School: ${c.school}`),

  if(isUT(c)&&/texas|mccombs|ut austin/i.test(p.school)) return `Fellow Longhorn / ${base}`;

function emailPrompt(c,kind){

  const signoff=(p.utSignoff&&isUT(c))?"Best, and Hook 'em!":"Best,";

SENDER
${meText()}

RECIPIENT
${contactText(c)}

CALL NOTES (the only source for anything specific about the call)
${c.notes||"(none)"}

RULES
- Greeting "Hi ${first},". ${kind==="thanks"?"3 to 4 sentences: thank them, name one specific piece of advice or story from the notes, say how you'll act on it, close warmly.":"3 sentences: a brief update tied to their advice if the notes give one, a thank-you, and no request beyond staying in touch."}
- Never invent details that are not in the notes. If the notes are empty, keep it general.
- Formal but warm, active voice. No em dashes. No hype words.
- Sign-off on its own line: "Best," then "${p.name}" on the next line.
- Subject: "${kind==="thanks"?"Thank you":"Quick update"}, ${p.name}" unless replying in a thread.

Return only JSON: {"subject":"","body":""}`;
  }
  return `Write a ${kind==="referral"?"referral":"cold"} networking email from a college student to a finance professional. Follow every rule exactly.

SENDER
${meText()}
Availability: ${p.availability||"flexible over the next two weeks"}

RECIPIENT (use only these facts; never invent a deal, post, role, or detail)
${contactText(c)}
${kind==="referral"?`Referred by: ${c.referrer||"(name missing)"}`:""}

THE EMAIL: exactly five sentences between the greeting and the sign-off.
1. "My name is ${p.name}, and I am a ${String(p.year||"student").toLowerCase()} studying ${p.major} at ${p.school} with an interest in ${tr.long} at ${firm}."
2. ${kind==="referral"?`"${c.referrer||"[Referrer]"} mentioned you would be a great person to learn from, and I noticed [real connection]." If there is no real connection, end the sentence after "learn from."`:`Connection: "I noticed [real connection, e.g. you are also a McCombs graduate], and I would value hearing how that path led you to [their group or firm]." Claim a connection only if the recipient facts support it (a shared school, org, hometown or activity from the sender's list). If none: "I noticed your path from [prior school or firm] to [group or firm], and I would value hearing what drew you to that work."`}
3. One specific observation from their profile, turned into something to learn from them. Use a DIFFERENT detail than sentence 2. Prefer, in order: a career switch or lateral move, a post they wrote, a deal they list, an unusual background tied to their work. If they are an incoming or current summer analyst, asking how they approached recruiting is a good fallback. If the profile is thin, ask about the work in their group in plain terms. Never invent.
4. "If you have 10 to 15 minutes in the coming weeks, I am available ${p.availability||"[availability]"}, and I am happy to work around your schedule."

FORMAT

- Sign-off: "${signoff}" then "${p.name}" on the next line.

- Subject: exactly "${defaultSubject(c,kind)}"

Return only JSON: {"subject":"","body":"","connection":"the connection used, or none","insightUsed":"the detail sentence 3 is built on","unverified":"anything you were unsure of, or empty"}`;
}
function followupTemplate(c,kind){
  const p=P(), f=firmOf(c), first=splitName(c.name).first||c.first, firm=f?.name||c.firm||"your firm";
  const subject="Re: "+(c.subject||defaultSubject(c,c.referrer?"referral":"cold"));

    ? `Hi ${first},\n\nI wanted to follow up on my previous note about a 10 to 15 minute call to hear about your experience at ${firm}. I remain available ${p.availability||"over the next few weeks"}, and I am happy to work around your schedule. Thank you again for considering it.\n\nBest,\n${p.name}`
    : `Hi ${first},\n\nI wanted to reach out one more time in case my earlier note got buried. If you have 10 to 15 minutes in the coming weeks, I would be grateful for the chance to connect and am flexible on timing. If now is not a good time, I completely understand and appreciate you considering it.\n\nBest,\n${p.name}`;

function profilePrompt(text,url){

Return only a JSON object:

Profile URL: ${url||"not given"}

"""

/* ---------- actions: email find / write / Gmail ---------- */
function setBusy(id,v){ if(v) S.busy[id]=v; else delete S.busy[id]; if(S.open===id) renderDrawer(true); if(id==="_answers") updateView(); }
function enrichOf(ctx,ent,re){
  const list=ctx?.contacts||ctx?.entities||ctx?.results||[];
  const row=list.find(x=>String(x.entityId??x.profile_id??x.id)===String(ent))||(list.length===1?list[0]:null);
  if(!row) return {done:false};
  const ens=Array.isArray(row.enrichments)?row.enrichments:[];
  const hits=ens.filter(e=>re.test(String(e.name||e.type||e.dataPointName||e.title||"")));
  if(!hits.length) return {done:false,row};
  const pending=hits.some(e=>/progress|pending|queued|running|processing/i.test(String(e.state||e.status||"")));
  const errored=hits.every(e=>/error|fail/i.test(String(e.state||e.status||"")));
  return {done:!pending,errored,hits,row};
}
async function clayEnrich(id,points){
  let c=S.contacts[id]; let taskId=c.clayTask, ent=c.clayEntity;
  if(!taskId||!ent){
    const f=firmOf(c); const dom=f?.domain||c.domain; if(!dom) throw {code:"tool_error",message:"Add this firm to your list (with its website) so Clay knows where to look."};
    const r=await call("Clay","search-contacts-by-name",{contactIdentifiers:[{contactName:c.name,companyIdentifier:dom}]});
    const hit=(r?.contacts||[])[0]; if(!hit) throw {code:"tool_error",message:`Clay couldn't find ${c.name} at ${f?.name||dom}.`};
    taskId=r.taskId; ent=String(hit.entityId??hit.profile_id);
    await saveContact(id,{clayTask:taskId,clayEntity:ent,...(!c.linkedin&&hit.url?{linkedin:hit.url}:{})});
  }
  await call("Clay","add-contact-data-points",{taskId,dataPoints:points,entityIds:[ent]});
  for(let i=0;i<16;i++){ await sleep(i<4?3000:5000);
    const ctx=await call("Clay","get-task-context",{taskId,entityIds:[ent]});
    const want=points.map(p=>p.type==="Email"?/email/i:/work|history/i);
    const parts=want.map(re=>enrichOf(ctx,ent,re));
    if(parts.every(x=>x.done)) return {ctx,parts};
  }
  throw {code:"tool_error",message:"Clay is still working on it. Try Verify again in a few minutes."};
}
async function findEmail(id,quiet){
  const c=S.contacts[id]; if(!c) return false;
  setBusy(id,"email");
  try{
    const {parts}=await clayEnrich(id,[{type:"Email"}]);
    const hit=parts[0]; const blob=JSON.stringify(hit.hits?.map(h=>h.value)??"");
    const f=firmOf(c); const found=(blob.match(EMAIL_RE_G)||[]).map(e=>e.toLowerCase()).filter(e=>!(c.bounced||[]).includes(e));
    const best=found.find(e=>f?.mail&&e.endsWith("@"+f.mail))||found[0];
    if(best){ await saveContact(id,{email:best,emailSrc:"clay",log:addLog(c,`Clay found ${best}`)}); if(!quiet) toast(`Verified: ${best}`,"ok"); return true; }
    if(!quiet) toast(`Clay had no email for ${c.name}. Keeping the format guess.`,"warn");
    if(!c.email){ const g=guessEmail(c); if(g) await saveContact(id,{email:g,emailSrc:"pattern"}); }
    return false;
  }catch(e){ if(!quiet) toast(errText(e,"Clay"),"crit"); else throw e; return false; }
  finally{ setBusy(id,null); }
}

async function writeEmail(id,kind,quiet){

let resumeCache=null;
async function resumeAttachment(){

  catch{ toast("Couldn't attach your resume. Attach it in Gmail before sending.","warn"); return null; }

function profilePatch(o){
  const out={};

/* ---------- Gmail sync ---------- */
async function syncGmail(manual){
  if(!S.mcp){ if(manual) toast("Gmail works when this page is open in Claude.","warn"); return; }
  if(S.syncing) return;
  const watch=Object.values(S.contacts).filter(c=>c.email&&["lead","drafted","emailed","fu1","fu2"].includes(c.stage));
  if(!watch.length){ S.lastSync=Date.now(); lsSet("cd.lastSync",S.lastSync); if(manual) toast("Nobody to check yet. Gmail sync tracks people once they have an email.","ok"); updateView(); return; }
  S.syncing=true; updateView();
  const emails=[...new Set(watch.map(c=>c.email.toLowerCase()))];
  const sent={}, replies={}, bounced=new Set();
  const ms=m=>Date.parse(m.date)||Number(m.internalDate)||0;
  try{
    for(const ch of chunks(emails,12)){
      const or=ch.join(" OR ");
      const ps=await call("Gmail","search_threads",{query:`in:sent to:(${or}) newer_than:180d`,pageSize:50,view:"THREAD_VIEW_METADATA_ONLY"});
      for(const t of ps?.threads||[]) for(const m of t.messages||[]){ if(!(m.labelIds||[]).includes("SENT")) continue; for(const r of [...(m.toRecipients||[]),...(m.ccRecipients||[])]){ const e=emailIn(r); if(ch.includes(e)) (sent[e] ||= []).push({at:ms(m),id:m.id,threadId:m.threadId||t.id}); } }
      const pr=await call("Gmail","search_threads",{query:`from:(${or}) newer_than:180d`,pageSize:50,view:"THREAD_VIEW_METADATA_ONLY"});
      for(const t of pr?.threads||[]) for(const m of t.messages||[]){ const e=emailIn(m.sender); if(ch.includes(e)) (replies[e] ||= []).push(ms(m)); }
    }
    const pb=await call("Gmail","search_threads",{query:"from:(mailer-daemon OR postmaster) newer_than:60d",pageSize:50,view:"THREAD_VIEW_MINIMAL"});
    for(const t of pb?.threads||[]) for(const m of t.messages||[]) for(const e of String((m.snippet||"")+" "+(m.subject||"")).match(EMAIL_RE_G)||[]){ const x=e.toLowerCase(); if(emails.includes(x)) bounced.add(x); }
  }catch(e){ S.syncing=false; updateView(); if(manual||e?.code!=="not_in_manifest") toast(errText(e,"Gmail"),"crit"); return; }
  let nS=0,nR=0,nB=0; const rank={lead:0,drafted:0,emailed:1,fu1:2,fu2:3};
  for(const c of watch){
    const e=c.email.toLowerCase(); const patch={}; const rp=(replies[e]||[]).filter(Boolean).sort((a,b)=>a-b);
    if(bounced.has(e)&&!rp.length){
      const bl=[...new Set([...(c.bounced||[]),e])]; const next=(c.altEmails||[]).find(a=>!bl.includes(a))||guessEmail(c,bl);
      Object.assign(patch,{bounced:bl,email:next||"",emailSrc:next?"pattern":"",stage:"lead",log:addLog(c,`Bounced: ${e}${next?`. Trying ${next}`:""}`)}); nB++;
    } else {
      const s=(sent[e]||[]).filter(x=>x.at).sort((a,b)=>a.at-b.at);
      if(s.length){ const f0=s[0], l=s[s.length-1];
        if(!c.emailedAt||f0.at<c.emailedAt) patch.emailedAt=f0.at;
        if(!c.lastSentAt||l.at>c.lastSentAt){ patch.lastSentAt=l.at; patch.lastMsgId=l.id; patch.threadId=l.threadId; }
        if(c.sentCount!==s.length) patch.sentCount=s.length;
        if(!c.subject&&c.lastDraft) patch.subject=c.draft?.subject||"";
        const want=s.length>=3?"fu2":s.length===2?"fu1":"emailed";
        if(rank[want]>rank[c.stage]){ patch.stage=want; if(rank[c.stage]===0){ nS++; patch.log=addLog(c,"Sent from Gmail"); } }
      }
      if(rp.length&&(!c.emailedAt||rp[rp.length-1]>=(patch.emailedAt||c.emailedAt)-DAY)){ Object.assign(patch,{stage:"replied",repliedAt:rp[rp.length-1],emailSrc:"replied",log:addLog(c,"They replied")}); nR++; }
    }
    if(!patch.subject) delete patch.subject;
    if(Object.keys(patch).length) await saveContact(c.id,patch).catch(()=>{});
  }
  S.lastSync=Date.now(); lsSet("cd.lastSync",S.lastSync); S.syncing=false; updateView();
  if(manual||nS||nR||nB) toast(`Gmail checked. ${nS} newly sent, ${nR} repl${nR===1?"y":"ies"}, ${nB} bounce${nB===1?"":"s"}.`,nR?"ok":"");
}

async function bulkDraft(ids){
  if(!P().name) return toast("Add your name in Setup first.","warn");
  const list=ids.map(id=>S.contacts[id]).filter(c=>c&&c.email&&c.stage==="lead");
  if(!list.length) return toast("None of these are leads with an email.","warn");
  const b=bulkStart("Writing Gmail drafts",list.length); let ok=0, fail="";
  for(const c of list){ if(b.stop) break;
    try{ const kind=c.referrer?"referral":"cold"; S.kind[c.id]=kind; const d=await writeEmail(c.id,kind,true); if(d&&await gmailDraft(c.id,true)) ok++; }
    catch(e){ fail=e?.code&&String(e.code).match(/not_granted|sampling|rate_limited|no_sample/)?sampleErr(e):(e?.server||/needs_reauth|server_not|not_in_manifest/.test(e?.code||"")?errText(e,"Gmail"):sampleErr(e)); if(/not_granted|sampling|rate_limited|needs_reauth|server_not|not_in_manifest|no_sample|no_mcp/.test(e?.code||"")) break; }

async function bulkFind(ids){

/* ---------- exports ---------- */
async function saveFile(filename,text){
  if(S.downloads){ try{ await S.downloads.save({filename,data:text}); return; }catch(e){ if(e?.code==="declined") return; } }
  openModal(`<div class="hd"><h2>${esc(filename)}</h2><button class="icon-btn" data-act="closeModal" aria-label="Close">×</button></div><p class="muted" style="margin:0">Copy this text and save it as a .csv file.</p><textarea class="in" rows="14" readonly id="exportText">${esc(text)}</textarea><div class="btn-row"><button class="btn primary" data-act="copyExport">Copy</button></div>`);
}
function exportCSV(){
  const cols=["name","firm","title","stage","email","email_source","linkedin","location","emailed_at","replied_at","call_at","ties","notes"];
  const rows=Object.values(S.contacts).map(c=>[c.name,firmOf(c)?.name||c.firm,c.title,stageOf(c.stage).label,c.email,c.emailSrc,c.linkedin,c.location,c.emailedAt?new Date(c.emailedAt).toISOString().slice(0,10):"",c.repliedAt?new Date(c.repliedAt).toISOString().slice(0,10):"",c.callAt?new Date(c.callAt).toISOString():"",(c.ties||[]).join("; "),c.notes]);
  saveFile(`coverage-desk-${new Date().toISOString().slice(0,10)}.csv`,[cols,...rows].map(r=>r.map(csvCell).join(",")).join("\n"));
}
/* Same columns as the sheet email_finder.py reads and writes, plus DeskId so rows match back on import.
   Confirmed emails go out filled (the script learns firm patterns from them); guesses go out blank so the script fills them. */
function exportFinder(){
  const list=Object.values(S.contacts); if(!list.length) return toast("Your pipeline is empty.","ok");
  const cols=["Category","Firm","Name","Title","Location","Email","Source","LinkedIn","Note","Confidence","Alt Guess","DeskId"];
  const srcName={clay:"Clay",replied:"Confirmed by reply",import:"Import",manual:"Typed in"};
  const rows=list.map(c=>{const f=firmOf(c); const ok=c.email&&srcName[c.emailSrc]; const cat=f?TYPES[f.type]:"";
    return [cat==="Texas & regional"?"Regional (TX)":cat,f?.name||c.firm,c.name,c.title,c.location,ok?c.email:"",ok?srcName[c.emailSrc]:"",c.linkedin,(c.bounced||[]).length?`Bounced: ${c.bounced.join("; ")}`:"",ok?"Confirmed":"","",c.id];});
  saveFile("UT_Alumni_Bankers.csv",[cols,...rows].map(r=>r.map(csvCell).join(",")).join("\n"));
  toast("Run: python email_finder.py UT_Alumni_Bankers.csv  then import the same file back here.","ok");
}

$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

/* ---------- boot ---------- */
async function checkConns(manual){
  if(!S.mcp){ for(const n of ["Clay","Gmail","Indeed"]) S.conn[n]="missing"; renderConns(); if(S.tab==="setup") updateSetup(); return; }
  try{ const r=await S.mcp.listTools(); const by={}; for(const s of r?.servers||[]) by[s.server]=s;
    for(const n of ["Clay","Gmail","Indeed"]){ const s=by[n]; S.conn[n]=!s?"missing":s.authStatus==="needs_reauth"?"reauth":(s.tools||[]).length?"ok":"missing"; } }
  catch{ if(manual) toast("Couldn't read connector status.","warn"); }
  renderConns(); if(S.tab==="setup") updateSetup();
}
async function maybeAutoSync(){
  if(S.autoSynced||!S.mcp||!S.perms||!S.ready.contacts) return; S.autoSynced=true;
  if(Date.now()-S.lastSync<20*60e3) return;
  try{ const st=await S.perms.state("mcp:Gmail"); if(st==="granted") syncGmail(false); }catch{}
}
function subscribe(){
  const db=S.db; const fail=name=>e=>toast(`Couldn't load ${name} (${e?.code||"error"}). Reload the page.`,"crit");
  db.collection("contacts").onSnapshot(s=>{ const m={}; for(const d of s.docs) if(d.exists) m[d.id]={...d.data(),id:d.id}; S.contacts=m; S.ready.contacts=true; dataChanged(); maybeAutoSync(); },fail("contacts"));
  db.collection("targets").onSnapshot(s=>{ const m={}; for(const d of s.docs) if(d.exists) m[d.id]={...d.data()}; S.targets=m; S.ready.targets=true; rebuildFirms(); dataChanged(); },fail("firms"));
  db.collection("apps").onSnapshot(s=>{ const m={}; for(const d of s.docs) if(d.exists) m[d.id]={...d.data(),id:d.id}; S.apps=m; S.ready.apps=true; dataChanged(); },fail("applications"));
  db.collection("jobs").onSnapshot(s=>{ const m={}; for(const d of s.docs) if(d.exists) m[d.id]={...d.data()}; for(const [k,v] of Object.entries(S.firmJobs)) if(!m[k]||(v.pulledAt||0)>(m[k].pulledAt||0)) m[k]=v; S.firmJobs=m; const first=!S.ready.jobs; S.ready.jobs=true; dataChanged(); if(first&&S.tab==="jobs") maybeAutoPull(); },()=>{ S.ready.jobs=true; });
  db.doc("config/profile").onSnapshot(d=>{ S.profile=d.exists?d.data():null; const first=!S.ready.profile; S.ready.profile=true; if(first||S.tab!=="setup"||!$("#view")?.contains(document.activeElement)){ if(S.tab==="setup"&&!first) mountView(); } if(first) mountView(); dataChanged(); },fail("profile"));
  db.doc("config/answers").onSnapshot(d=>{ S.answers=d.exists?d.data():null; dataChanged(); },()=>{});
  db.doc("config/lastRun").onSnapshot(d=>{ S.lastRun=d.exists?d.data():null; dataChanged(); },()=>{});
  db.doc("config/resumeReview").onSnapshot(d=>{ if(d.exists&&!S.rs.running&&!S.rs.dirty){ const v=d.data(); S.rs.lines=Array.isArray(v.lines)?v.lines:[]; S.rs.overall=v.overall||null; S.rs.keywords=v.keywords||[]; S.rs.target=v.target||S.rs.target; dataChanged(); } },()=>{});
}
async function boot(){
  renderTabs(); renderConns(); mountView();
  const use=n=>(window.claude&&typeof window.claude.use==="function")?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,mcp,sample,assets,downloads,perms]=await Promise.all(["db","mcp","sample","assets","downloads","permissions"].map(use));
  Object.assign(S,{db,mcp,sample,assets,downloads,perms,booted:true});
  if(db) subscribe(); else { Object.keys(S.ready).forEach(k=>S.ready[k]=true); }
  mountView(); checkConns();
}
boot();
</script>
